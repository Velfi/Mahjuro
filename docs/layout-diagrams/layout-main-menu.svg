<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <radialGradient id="menuglow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#2d6b32"/>
      <stop offset="35%" stop-color="#0f2818"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>
    <linearGradient id="tablet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="50%" stop-color="#3d2618"/>
      <stop offset="100%" stop-color="#1a100c"/>
    </linearGradient>
  </defs>

  <rect fill="url(#menuglow)" stroke="#3d4d40" stroke-width="2" x="1" y="1" width="998" height="558" rx="6"/>
  <g fill="#a8c4e8" fill-opacity="0.35" font-family="sans-serif" font-size="3">
    <circle cx="120" cy="80" r="1.2"/><circle cx="880" cy="120" r="1"/><circle cx="200" cy="40" r="0.8"/>
    <circle cx="750" cy="200" r="1.1"/><circle cx="340" cy="300" r="0.9"/><circle cx="600" cy="90" r="1"/>
  </g>

  <text fill="#f0f4f8" font-family="sans-serif" font-size="14" font-weight="bold" x="24" y="26">Main menu (from screenshot)</text>
  <text fill="#94a3b8" font-family="sans-serif" font-size="9" x="24" y="42">Starfield + central green wash; headless demo profile line under title</text>

  <!-- Seven title tiles across top center -->
  <g stroke="#c9a227" stroke-width="1" fill="#f5ecd8">
    <rect x="343" y="52" width="38" height="52" rx="3"/><rect x="389" y="52" width="38" height="52" rx="3"/>
    <rect x="435" y="52" width="38" height="52" rx="3"/><rect x="481" y="52" width="38" height="52" rx="3"/>
    <rect x="527" y="52" width="38" height="52" rx="3"/><rect x="573" y="52" width="38" height="52" rx="3"/>
    <rect x="619" y="52" width="38" height="52" rx="3"/>
  </g>
  <text fill="#b45309" font-family="serif" font-size="10" font-weight="bold" x="500" y="82" text-anchor="middle">title strip</text>

  <text fill="#e8eaed" font-family="sans-serif" font-size="10" x="500" y="118" text-anchor="middle">Profile / Level / runs (caption)</text>

  <!-- Candles: flank stack near mid height -->
  <rect fill="#f5f0e6" stroke="#d4c4a8" x="332" y="248" width="28" height="120" rx="6"/>
  <polygon fill="#fcd34d" stroke="#f59e0b" points="346,248 352,232 340,232"/>
  <rect fill="#f5f0e6" stroke="#d4c4a8" x="640" y="248" width="28" height="120" rx="6"/>
  <polygon fill="#fcd34d" stroke="#f59e0b" points="654,248 660,232 648,232"/>

  <!-- Stepped wood tablets: slightly wider toward bottom; first item focus ring -->
  <g font-family="serif" font-size="11" fill="#d4af37" text-anchor="middle">
    <rect fill="none" stroke="#ffffff" stroke-width="2" x="419" y="188" width="162" height="28" rx="3"/>
    <rect fill="url(#tablet)" stroke="#5c4033" x="424" y="192" width="152" height="24" rx="2"/><text x="500" y="208">Play</text>
    <rect fill="url(#tablet)" stroke="#5c4033" x="422" y="224" width="156" height="24" rx="2"/><text x="500" y="240">Solitaire</text>
    <rect fill="url(#tablet)" stroke="#5c4033" x="420" y="256" width="160" height="24" rx="2"/><text x="500" y="272">Meld Guide</text>
    <rect fill="url(#tablet)" stroke="#5c4033" x="418" y="288" width="164" height="24" rx="2"/><text x="500" y="304">Profile</text>
    <rect fill="url(#tablet)" stroke="#5c4033" x="416" y="320" width="168" height="24" rx="2"/><text x="500" y="336">Collection</text>
    <rect fill="url(#tablet)" stroke="#5c4033" x="414" y="352" width="172" height="24" rx="2"/><text x="500" y="368">Options</text>
    <rect fill="url(#tablet)" stroke="#5c4033" x="412" y="384" width="176" height="24" rx="2"/><text x="500" y="400">Quit</text>
  </g>

  <text fill="#cbd5e1" font-family="sans-serif" font-size="9" x="500" y="528" text-anchor="middle">Footer: Arrow keys / Enter (hint)</text>
  <text fill="#64748b" font-family="sans-serif" font-size="8" x="24" y="548">Layout code: menu center ~38% height; title band above; candles + tablets are Placement objects in 3D</text>
</svg>
