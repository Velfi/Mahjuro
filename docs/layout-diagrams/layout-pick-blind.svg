  <g fill="#fbbf24" fill-opacity="0.45">
    <circle cx="180" cy="100" r="1.5"/><circle cx="820" cy="140" r="1.2"/><circle cx="450" cy="60" r="1"/><circle cx="600" cy="200" r="1.3"/>
    <circle cx="320" cy="320" r="1"/><circle cx="900" cy="400" r="1.4"/><circle cx="100" cy="380" r="1.1"/><circle cx="700" cy="80" r="1"/>
  </g>

  <text fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" x="24" y="26">Pick blind (from screenshot)</text>
  <text fill="#94a3b8" font-family="sans-serif" font-size="9" x="24" y="42">Black + embers; strong warm key on Small blind and floor lip</text>

  <!-- Floor slab: bright left, falls off right -->
  <path fill="url(#floorlit)" stroke="#64748b" stroke-width="1.5"
        d="M 40 340 L 960 335 L 972 398 L 28 408 Z"/>

  <!-- Small / Big / Boss masses (left glows, others silhouette) -->
