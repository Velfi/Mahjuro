      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="22%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="spot" cx="22%" cy="72%" r="40%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect fill="#030507" stroke="#334155" stroke-width="2" x="1" y="1" width="998" height="558" rx="6"/>
