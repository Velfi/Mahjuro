<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mahjuro gameplay: target UI (y downward).
  Bowl + mirror in their own row between hand rack and sort+journal.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 124" width="800" height="744" font-family="system-ui, -apple-system, sans-serif" font-size="2.2px">
  <title>Gameplay UI - layout (conceptual)</title>
  <defs>
    <style>
      .band { stroke: #333; stroke-width: 0.15; }
      .label { fill: #111; }
      .note { fill: #444; font-size: 1.8px; }
      .title { font-weight: 600; font-size: 2.8px; fill: #000; }
    </style>
  </defs>

  <rect width="100" height="124" fill="#f5f5f0"/>
  <text x="2" y="4" class="title">Gameplay window (percent of height, y down)</text>

  <rect x="0" y="0" width="100" height="12" fill="#c9d4e8" class="band"/>
  <text x="2" y="7.5" class="label">Score panel (~12% h)</text>

  <rect x="0" y="12" width="100" height="8" fill="#d4e0c9" class="band"/>
  <text x="2" y="17" class="label">Modifier strip (~8%)</text>

  <rect x="0" y="20" width="72" height="12" fill="#e8d9c9" class="band"/>
  <text x="2" y="26" class="label">Relic strip</text>
  <rect x="72" y="20" width="28" height="12" fill="#d0e0d8" class="band"/>
  <text x="73" y="26" class="label">Consumables</text>

  <rect x="7" y="32" width="86" height="60" fill="#e8e4dc" class="band"/>
  <text x="9" y="35.5" class="label">Hand strip - 14 slots (rack toward player / bottom)</text>

  <rect x="10" y="36" width="80" height="12" fill="#b8c5d6" opacity="0.45" stroke="#446" stroke-width="0.08"/>
  <rect x="11" y="37.5" width="38" height="9" fill="#9aaab8" opacity="0.95" stroke="#335" stroke-width="0.1"/>
  <text x="30" y="42.5" class="label" text-anchor="middle">Structure mat</text>
  <rect x="50" y="37.5" width="18" height="9" fill="#aab8a0" opacity="0.85" stroke="#353" stroke-width="0.08"/>
  <text x="59" y="42" class="label" text-anchor="middle">tokens</text>
  <rect x="70" y="37.5" width="18" height="9" fill="#7a9e8c" opacity="0.9" stroke="#253" stroke-width="0.1"/>
  <text x="79" y="42.5" class="label" text-anchor="middle">Commit</text>

  <rect x="10" y="49" width="80" height="6.5" fill="#b8c5d6" opacity="0.35" stroke="#446" stroke-width="0.08"/>
  <rect x="11" y="50" width="78" height="5" fill="#a8b8cc" opacity="0.9" stroke="#446" stroke-width="0.08"/>
  <text x="50" y="53" class="label" text-anchor="middle">Yaku tablets</text>

  <rect x="11" y="59.5" width="78" height="12" fill="#c4b8a8" opacity="0.5" stroke="#654" stroke-width="0.08" stroke-dasharray="1 0.5"/>
  <text x="50" y="66.5" class="label" text-anchor="middle">3D hand tiles (rack)</text>

  <rect x="10" y="75.5" width="80" height="11" fill="#e4e0d8" opacity="0.9" stroke="#887" stroke-width="0.08"/>
  <rect x="12" y="77" width="18" height="8" fill="#c8b8a8" opacity="0.85" stroke="#654" stroke-width="0.1"/>
  <text x="21" y="81.5" class="note" text-anchor="middle">bowl</text>
  <rect x="33" y="77" width="34" height="8" fill="#f0ede8" stroke="#bbb" stroke-width="0.08" stroke-dasharray="0.6 0.4"/>
  <text x="50" y="81" class="note" text-anchor="middle">gap</text>
  <rect x="70" y="77" width="18" height="8" fill="#a8c8d8" opacity="0.85" stroke="#456" stroke-width="0.1"/>
  <text x="79" y="81.5" class="note" text-anchor="middle">mirror</text>

  <rect x="10" y="87.5" width="80" height="7" fill="#a8a090" class="band"/>
  <text x="50" y="92" class="label" text-anchor="middle">Sort Suit / Sort Rank + Journal</text>

  <rect x="0.5" y="32" width="5" height="31" fill="#ddd" opacity="0.6" class="band"/>
  <text x="0.8" y="46" class="note" transform="rotate(-90 2 46)">candles</text>
  <rect x="94.5" y="32" width="5" height="31" fill="#ddd" opacity="0.6" class="band"/>
  <text x="98" y="46" class="note" transform="rotate(90 98 46)">candles</text>
  <rect x="0.5" y="60.5" width="5" height="28" fill="#ddd" opacity="0.6" class="band"/>
  <text x="0.8" y="74.5" class="note" transform="rotate(-90 2 74.5)">candles</text>
  <rect x="94.5" y="60.5" width="5" height="28" fill="#ddd" opacity="0.6" class="band"/>
  <text x="98" y="74.5" class="note" transform="rotate(90 98 74.5)">candles</text>

  <g transform="translate(2, 104)" class="note">
    <text x="0" y="0"><tspan x="0" dy="0">Structure above yaku; cash-in right of mat; tier tokens</tspan><tspan x="0" dy="3.2">beside commit. Bowl and mirror: row under the rack, above sort.</tspan></text>
  </g>
</svg>
