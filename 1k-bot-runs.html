<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahjuro bot report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --navy0: #0b1220;
    --navy1: #111b2e;
    --navy2: #1a2740;
    --navy3: #243652;
    --surface: #151f33;
    --surface-raised: #1c2840;
    --border: rgba(255, 255, 255, 0.12);
    --border-soft: rgba(255, 255, 255, 0.08);
    --text: #f2f5fa;
    --muted: #b6c5db;
    --faint: #8a9db5;
    --accent: #4db8e8;
    --accent-dim: rgba(77, 184, 232, 0.12);
    --accent2: #e8a06e;
    --accent2-dim: rgba(232, 160, 110, 0.12);
    --accent3: #e8c96e;
    --positive: #6fcf97;
    --danger: #f08090;
    --radius: 8px;
    --radius-sm: 6px;
    --font: "Atkinson Hyperlegible", ui-sans-serif, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }

  html {
    font-family: var(--font);
    line-height: 1.45;
    font-size: 14px;
    color: var(--text);
    background: var(--navy0);
    -webkit-font-smoothing: antialiased;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--navy0);
  }

  .dash-root {
    width: min(98vw, 1780px);
    max-width: none;
    margin: 0 auto;
    padding: 0.7rem 0.75rem 1.4rem;
  }

  @media (min-width: 900px) {
    .dash-root { padding: 0.85rem 1rem 1.8rem; }
  }

  /* —— Header —— */
  .dash-header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 0.7rem 1rem;
    margin-bottom: 0.85rem;
    padding-bottom: 0.65rem;
    border-bottom: 1px solid var(--border);
  }

  .dash-header__brand {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .dash-header__title {
    font-size: clamp(1.35rem, 2.5vw, 1.65rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--text);
  }

  .dash-header__title em {
    font-style: normal;
    color: var(--accent);
  }

  .dash-header__tagline {
    margin: 0;
    font-size: 0.9rem;
    color: var(--muted);
    max-width: 56ch;
  }

  .dash-header__chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    justify-content: flex-end;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 700;
    border: 1px solid var(--border);
    background: var(--surface-raised);
    color: var(--text);
  }

  .chip--accent {
    border-color: rgba(77, 184, 232, 0.45);
    background: var(--accent-dim);
    color: var(--accent);
  }

  .chip--warm {
    border-color: rgba(232, 160, 110, 0.45);
    background: var(--accent2-dim);
    color: var(--accent2);
  }

  .chip--note {
    border-color: rgba(232, 201, 110, 0.4);
    background: rgba(232, 201, 110, 0.1);
    color: var(--accent3);
  }

  /* —— 2-column shell —— */
  .dash-cols {
    display: grid;
    gap: 0.7rem;
    align-items: start;
  }

  @media (min-width: 960px) {
    .dash-cols {
      grid-template-columns: minmax(0, 2.15fr) minmax(280px, 340px);
    }
  }

  @media (min-width: 1400px) {
    .dash-cols {
      grid-template-columns: minmax(0, 2.45fr) minmax(300px, 360px);
      gap: 0.85rem;
    }
  }

  .dash-col { display: flex; flex-direction: column; gap: 0.7rem; min-width: 0; }

  .dash-full {
    margin-top: 0.7rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }

  /* —— Widget cards —— */
  .widget {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .widget__head {
    padding: 0.5rem 0.65rem;
    border-bottom: 1px solid var(--border-soft);
    background: var(--surface-raised);
  }

  .widget__title {
    margin: 0;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
  }

  .widget__sub {
    margin: 0.35rem 0 0;
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.45;
  }

  .widget__body {
    padding: 0.55rem 0.65rem 0.65rem;
  }

  /* —— Hero metrics —— */
  .hero-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.45rem;
    margin-bottom: 0.25rem;
  }

  @media (max-width: 640px) {
    .hero-row { grid-template-columns: 1fr; }
  }

  .hero-metric {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.55rem 0.65rem;
  }

  .hero-metric__label {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
  }

  .hero-metric__value {
    font-size: clamp(1.25rem, 3.2vw, 1.65rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
    margin: 0.25rem 0 0;
    color: var(--text);
  }

  .hero-metric__value--accent { color: var(--accent); }
  .hero-metric__value--warm { color: var(--accent2); }
  .hero-metric__value--note { color: var(--accent3); }

  .hero-metric__foot {
    margin-top: 0.45rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }

  .pill {
    font-size: 0.78rem;
    font-weight: 700;
    padding: 0.2rem 0.45rem;
    border-radius: 4px;
  }

  .pill--accent { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(77, 184, 232, 0.4); }
  .pill--warm { background: var(--accent2-dim); color: var(--accent2); border: 1px solid rgba(232, 160, 110, 0.4); }
  .pill--muted { background: var(--navy2); color: var(--muted); border: 1px solid var(--border); }

  /* —— KPI strip —— */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.4rem;
  }

  @media (min-width: 640px) {
    .kpi-grid { grid-template-columns: repeat(3, 1fr); }
  }

  @media (min-width: 1100px) {
    .kpi-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.4rem 0.5rem;
  }

  .kpi__label {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--faint);
    margin-bottom: 0.12rem;
  }

  .kpi__value {
    font-size: 0.98rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
    color: var(--text);
  }

  .kpi--highlight .kpi__value { color: var(--accent); }

  .mini-bars {
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
  }

  .mini-bar {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.35rem 0.5rem;
    align-items: center;
    font-size: 0.88rem;
  }

  .mini-bar__label {
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .mini-bar__track {
    grid-column: 1 / -1;
    height: 8px;
    border-radius: 4px;
    background: var(--navy1);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .mini-bar__fill {
    height: 100%;
    border-radius: 3px;
    background: var(--accent);
    min-width: 2px;
  }

  .mini-bar__fill--warm {
    background: var(--accent2);
  }

  .mini-bar__val {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-weight: 700;
    font-size: 0.85rem;
  }

  .target-chart {
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
  }

  .target-chart__legend {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem 1.25rem;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 0.15rem;
  }

  .target-chart__legend-item {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }

  .target-chart__swatch {
    width: 0.85rem;
    height: 0.65rem;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .target-chart__swatch--target {
    background: linear-gradient(90deg, rgba(232, 160, 110, 0.95), rgba(232, 160, 110, 0.65));
    border: 1px solid rgba(232, 160, 110, 0.5);
  }

  .target-chart__swatch--avg {
    background: rgba(77, 184, 232, 0.85);
    border: 1px solid rgba(77, 184, 232, 0.45);
  }

  .target-chart__row {
    display: grid;
    grid-template-columns: 3.6rem 1fr minmax(5.5rem, auto);
    gap: 0.45rem 0.55rem;
    align-items: center;
    font-size: 0.82rem;
  }

  .target-chart__label {
    color: var(--muted);
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .target-chart__track {
    position: relative;
    height: 1.15rem;
    border-radius: 4px;
    background: var(--navy1);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .target-chart__fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    border-radius: 3px;
    min-width: 2px;
    transition: width 0.35s ease;
  }

  .target-chart__fill--target {
    background: linear-gradient(90deg, rgba(232, 160, 110, 0.9), rgba(232, 160, 110, 0.55));
    z-index: 0;
  }

  .target-chart__fill--avg {
    background: rgba(77, 184, 232, 0.82);
    z-index: 1;
    box-shadow: inset 0 0 0 1px rgba(77, 184, 232, 0.35);
  }

  .target-chart__vals {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 0.78rem;
    line-height: 1.35;
    text-align: right;
    white-space: nowrap;
  }

  .target-chart__vals strong {
    color: var(--text);
    font-weight: 700;
  }

  svg.chart { width: 100%; height: auto; display: block; }
  .chart-axis { stroke: var(--border); stroke-width: 1; }
  .chart-grid { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 3 3; }
  .chart-tick { fill: var(--faint); font-size: 9px; font-family: var(--font); }
  .chart-label { fill: var(--muted); font-size: 10px; font-family: var(--font); }
  .candle-target { stroke: var(--accent2); stroke-width: 1.5; stroke-dasharray: 4 3; opacity: 0.85; }
  .candle-wick { stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; }
  .candle-body { stroke-width: 1; }
  .candle-body--up { fill: rgba(111, 207, 151, 0.55); stroke: var(--positive); }
  .candle-body--down { fill: rgba(240, 128, 144, 0.45); stroke: var(--danger); }
  .candle-legend {
    display: flex; flex-wrap: wrap; gap: 0.35rem 0.85rem;
    margin-bottom: 0.5rem; font-size: 0.78rem; color: var(--muted);
  }
  .candle-legend__item { display: inline-flex; align-items: center; gap: 0.35rem; }
  .candle-legend__swatch { width: 0.75rem; height: 0.65rem; border-radius: 2px; border: 1px solid var(--border); }
  .chart-legend {
    display: flex; flex-wrap: wrap; gap: 0.35rem 0.85rem;
    margin-bottom: 0.45rem; font-size: 0.78rem; color: var(--muted);
  }
  .chart-legend__item { display: inline-flex; align-items: center; gap: 0.35rem; }
  .chart-legend__swatch { width: 0.65rem; height: 0.65rem; border-radius: 2px; flex-shrink: 0; }
  .table-details { margin-top: 0.65rem; font-size: 0.88rem; }
  .table-details > summary {
    cursor: pointer; color: var(--accent); font-weight: 700; list-style: none;
  }
  .table-details > summary::-webkit-details-marker { display: none; }
  .table-details__body { margin-top: 0.5rem; }
  .card__panels { display: flex; flex-direction: column; gap: 0.85rem; }

  .loss-list {
    margin: 0;
    padding-left: 1.15rem;
    font-size: 0.9rem;
    color: var(--text);
    line-height: 1.55;
  }

  .loss-list li { margin-bottom: 0.35rem; }

  /* —— Stat grid —— */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
  }

  @media (min-width: 640px) {
    .stat-grid {
      grid-template-columns: minmax(9rem, 0.42fr) 1fr;
    }
  }

  .stat-grid dt {
    font-size: 0.88rem;
    color: var(--muted);
    padding: 0.45rem 0;
    border-bottom: 1px solid var(--border-soft);
    font-weight: 700;
  }

  .stat-grid dd {
    margin: 0;
    font-size: 0.88rem;
    padding: 0.45rem 0;
    border-bottom: 1px solid var(--border-soft);
    font-variant-numeric: tabular-nums;
    text-align: left;
    line-height: 1.45;
  }

  @media (min-width: 640px) {
    .stat-grid dd { text-align: right; }
  }

  .stat-grid dt:last-of-type,
  .stat-grid dd:last-of-type { border-bottom: none; }

  .stat-grid dt.dt-with-help {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.2rem;
  }

  /* —— Inline field help (?); empty button + ::after keeps TSV headers clean —— */
  .field-help {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 1.125rem;
    height: 1.125rem;
    margin: 0;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--navy2);
    color: var(--muted);
    font: inherit;
    line-height: 1;
    cursor: help;
    vertical-align: middle;
  }

  .field-help::after {
    content: '?';
    font-size: 0.62rem;
    font-weight: 800;
    line-height: 1;
  }

  .field-help:hover,
  .field-help:focus-visible {
    color: var(--accent);
    border-color: rgba(77, 184, 232, 0.45);
    background: var(--accent-dim);
  }

  .field-help:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .th-label-wrap,
  .data-table th.th-sort .th-sort__head {
    display: inline-flex;
    align-items: center;
    gap: 0.2rem;
    flex-wrap: wrap;
    max-width: 100%;
  }

  .data-table th.th-sort .th-sort__head {
    padding-right: 0.15rem;
  }

  .kpi__label-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.2rem;
    margin-bottom: 0.2rem;
  }

  .kpi__label-row .kpi__label {
    margin-bottom: 0;
  }

  /* —— Full-width cards —— */
  .dash-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .dash-card__head {
    padding: 0.5rem 0.65rem;
    border-bottom: 1px solid var(--border-soft);
    background: var(--surface-raised);
  }

  .dash-card__title {
    font-size: 1rem;
    font-weight: 700;
    margin: 0;
    color: var(--text);
  }

  .dash-card__subtitle {
    margin: 0.35rem 0 0;
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.45;
  }

  .dash-card__body { padding: 0.55rem 0.65rem 0.65rem; }

  .dash-card__subhead {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--muted);
    margin: 0.75rem 0 0.35rem;
    padding-top: 0.45rem;
    border-top: 1px solid var(--border-soft);
  }

  .dash-card__subhead:first-child {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }

  /* —— Tables —— */
  .table-scroll {
    overflow-x: auto;
    margin: 0;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft);
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  .data-table thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    text-align: left;
    padding: 0.34rem 0.48rem;
    font-weight: 700;
    font-size: 0.76rem;
    color: var(--text);
    background: var(--navy3);
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
  }

  .data-table tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.03); }
  .data-table tbody tr:hover { background: rgba(77, 184, 232, 0.06); }

  .data-table td {
    padding: 0.3rem 0.48rem;
    border-bottom: 1px solid var(--border-soft);
    vertical-align: middle;
  }

  .data-table tbody tr:last-child td { border-bottom: none; }

  .data-table .num {
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-family: var(--mono);
    font-size: 0.8rem;
  }

  .data-table th.th-sort {
    cursor: pointer;
    user-select: none;
    padding-right: 1.35rem;
    position: relative;
  }

  .data-table th.th-sort:hover {
    color: var(--accent);
  }

  .data-table th.th-sort .th-sort__ind {
    position: absolute;
    right: 0.35rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.65rem;
    opacity: 0.85;
  }

  .data-table tr.data-table__group td {
    font-weight: 700;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    background: rgba(77, 184, 232, 0.08);
    border-bottom: 1px solid var(--border);
    padding-top: 0.38rem;
    padding-bottom: 0.34rem;
  }

  .table-with-copy {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .table-with-copy__bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    min-height: 1.5rem;
  }

  .table-copy-btn {
    font: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.28rem 0.65rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-raised);
    color: var(--muted);
    cursor: pointer;
  }

  .table-copy-btn:hover {
    color: var(--text);
    border-color: rgba(77, 184, 232, 0.45);
    background: var(--accent-dim);
  }

  .table-copy-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .table-copy-btn:disabled {
    opacity: 0.65;
    cursor: default;
  }

  .table-toolbar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.65rem;
    font-size: 0.86rem;
    color: var(--muted);
  }

  .table-toolbar input { accent-color: var(--accent); }

  .bar-track {
    height: 8px;
    border-radius: 4px;
    background: var(--navy1);
    border: 1px solid var(--border);
    overflow: hidden;
    width: 100%;
    min-width: 3rem;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--accent);
    transition: width 0.35s ease;
  }

  .bar-wrap {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    min-width: 5rem;
    width: 100%;
    max-width: 100%;
  }

  .delta-pos { color: var(--positive); }
  .delta-neg { color: var(--danger); }

  .prose {
    font-size: 0.9rem;
    color: var(--muted);
    line-height: 1.55;
    margin: 0;
  }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
  }

  .chip--tag {
    font-size: 0.82rem;
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
    background: var(--navy3);
    border: 1px solid var(--border);
    color: var(--text);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }

  .meta-block {
    font-size: 0.9rem;
    color: var(--muted);
    line-height: 1.6;
  }

  .meta-block strong { color: var(--text); font-weight: 650; }

  .error {
    color: var(--danger);
    padding: 1rem;
    background: rgba(255, 107, 122, 0.08);
    border: 1px solid rgba(255, 107, 122, 0.3);
    border-radius: var(--radius);
    margin: 1rem;
  }

  .foot-note {
    margin-top: 1rem;
    padding-top: 0.85rem;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.5;
  }

  .ci-help {
    margin: 0 0 1.1rem;
    border: 1px solid var(--border-soft);

<main id="app" class="dash-root"></main>
<script>
(function () {
  const exportNode = document.getElementById('mahjuro-bot-export');
  const app = document.getElementById('app');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null && text !== '') e.textContent = text;
    return e;
  }

  /** Hover/focus tooltip; stops sort when placed inside a sortable header. */
  function fieldHelp(text) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'field-help';
    b.title = text;
    b.setAttribute('aria-label', text);
    const stop = (ev) => { ev.stopPropagation(); };
    b.addEventListener('click', (ev) => { ev.preventDefault(); stop(ev); });
    b.addEventListener('mousedown', stop);
    return b;
  }

  function thPlain(label, help) {
    const th = el('th', null);
    if (help) {
      const wrap = el('span', 'th-label-wrap');
      wrap.appendChild(document.createTextNode(label));
      wrap.appendChild(fieldHelp(help));
      th.appendChild(wrap);
    } else {
      th.textContent = label;
    }
    return th;
  }

  function fmtCompact(n) {
    if (typeof n !== 'number' || !Number.isFinite(n)) return String(n);
    return new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 2 }).format(n);
  }

  function loadPayload() {
    const text = exportNode.textContent.trim();
    const data = JSON.parse(text);
    globalThis.MAHJURO_BOT_EXPORT = data;
    return data;
  }

  function widget(title, subtitle, cls) {
    const section = el('section', 'widget' + (cls ? ' ' + cls : ''));
    const head = el('div', 'widget__head');
    head.appendChild(el('h2', 'widget__title', title));
    if (subtitle) head.appendChild(el('p', 'widget__sub', subtitle));
    section.appendChild(head);
    const body = el('div', 'widget__body');
    section.appendChild(body);
    return { section, body };
  }

  function card(title, subtitle) {
    const section = el('section', 'dash-card');
    const head = el('div', 'dash-card__head');
    head.appendChild(el('h2', 'dash-card__title', title));
    if (subtitle) head.appendChild(el('p', 'dash-card__subtitle', subtitle));
    section.appendChild(head);
    const body = el('div', 'dash-card__body');
    section.appendChild(body);
    return { section, body };
  }

  const RELIC_TIER_ORDER = ['legendary', 'rare', 'uncommon', 'common'];

  function rarityRank(slugOrLabel) {
    const s = String(slugOrLabel || '').toLowerCase();
    const i = RELIC_TIER_ORDER.indexOf(s);
    return i === -1 ? 99 : i;
  }

  function formatTier(raritySlug) {
    if (!raritySlug) return '—';
    const s = String(raritySlug).toLowerCase();
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function normalizeTableRow(r) {
    if (Array.isArray(r)) return { cells: r };
    return { cells: r.cells, keys: r.keys, raritySlug: r.raritySlug };
  }

  function cellSortValue(cell, sort) {
    if (!sort || sort === false) return null;
    const text = cell instanceof Node ? cell.textContent.trim() : String(cell);
    if (sort === 'num') {
      const n = parseFloat(text.replace(/,/g, ''));
      return Number.isFinite(n) ? n : 0;
    }
    if (sort === 'pct') {
      const n = parseFloat(text.replace(/%/g, ''));
      return Number.isFinite(n) ? n : 0;
    }
    if (sort === 'tier') return rarityRank(text === '—' ? '' : text.toLowerCase());
    return text.toLowerCase();
  }

  function rowSortValue(row, col, headers, cell) {
    const nr = normalizeTableRow(row);
    if (nr.keys && nr.keys[col] !== undefined && nr.keys[col] !== null) return nr.keys[col];
    return cellSortValue(cell, headers[col].sort);
  }

  function compareSortValues(a, b, dir) {
    const mul = dir === 'desc' ? -1 : 1;
    if (a == null && b == null) return 0;
    if (a == null) return 1 * mul;
    if (b == null) return -1 * mul;
    if (typeof a === 'number' && typeof b === 'number' && Number.isFinite(a) && Number.isFinite(b)) {
      if (a === b) return 0;
      return mul * (a < b ? -1 : 1);
    }
    return mul * String(a).localeCompare(String(b), undefined, { numeric: true });
  }

  function cellPlainText(cell) {
    return cell.textContent.replace(/\r?\n/g, ' ').replace(/\t/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function rowToTsvValues(tr) {
    const vals = [];
    for (const cell of tr.cells) {
      vals.push(cellPlainText(cell));
      const span = cell.colSpan || 1;
      for (let i = 1; i < span; i++) vals.push('');
    }
    return vals;
  }

  function tableToTsv(tableEl) {
    const lines = [];
    if (tableEl.tHead) {
      for (const tr of tableEl.tHead.rows) {
        lines.push(rowToTsvValues(tr).join('\t'));
      }
    }
    for (const tb of tableEl.tBodies) {
      for (const tr of tb.rows) {
        lines.push(rowToTsvValues(tr).join('\t'));
      }
    }
    return lines.join('\n');
  }

  function copyTextToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve, reject) => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        if (!document.execCommand('copy')) reject(new Error('copy failed'));
        else resolve();
      } catch (e) {
        reject(e);
      } finally {
        document.body.removeChild(ta);
      }
    });
  }

  /**
   * headers: { label, align?, help?, sort?: 'str'|'num'|'pct'|'tier'|false, sortDefault?: 'asc'|'desc' }
   * rows: cell arrays, or { cells, keys? } where keys[i] overrides sort value for column i
   */
  function addTable(parent, headers, rows, options) {
    const opts = options || {};
    const groupSpec = opts.group; // { enabled: () => bool, tierOf: (normRow) => string }

    const block = el('div', 'table-with-copy');
    const bar = el('div', 'table-with-copy__bar');
    const copyBtn = el('button', 'table-copy-btn', 'Copy');
    copyBtn.type = 'button';
    copyBtn.title = 'Copy table as TSV (spreadsheet paste)';
    bar.appendChild(copyBtn);
    block.appendChild(bar);

    const wrap = el('div', 'table-scroll');
    const table = el('table', 'data-table');
    const thead = el('thead');
    const trh = el('tr');
    const tbody = el('tbody');

    let normRows = rows.map(normalizeTableRow);
    const state = { col: null, dir: null };

    function sortDefaults(colIdx) {
      const h = headers[colIdx];
      if (h.sortDefault) return h.sortDefault;
      return h.sort === 'str' ? 'asc' : 'desc';
    }

    function sortedModels(models) {
      const col = state.col;
      const dir = state.dir;
      if (col == null || !headers[col] || !headers[col].sort) return models.slice();
      return models.slice().sort((ra, rb) => {
        const ca = ra.cells[col];
        const cb = rb.cells[col];
        const va = rowSortValue(ra, col, headers, ca);
        const vb = rowSortValue(rb, col, headers, cb);
        let cmp = compareSortValues(va, vb, dir);
        if (cmp === 0) {
          const na = String(ra.cells[0] instanceof Node ? ra.cells[0].textContent : ra.cells[0]);
          const nb = String(rb.cells[0] instanceof Node ? rb.cells[0].textContent : rb.cells[0]);
          cmp = na.localeCompare(nb);
        }
        return cmp;
      });
    }

    function tierKeyFromRow(nr) {
      if (!groupSpec || !groupSpec.tierOf) return '_other';
      return groupSpec.tierOf(nr);
    }

    function renderBody() {
      while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
      normRows = rows.map(normalizeTableRow);
      const useGroup = groupSpec && groupSpec.enabled && groupSpec.enabled();
      let list = sortedModels(normRows);
      if (useGroup) {
        const order = RELIC_TIER_ORDER.concat(['_other']);
        const byT = new Map();
        for (const t of order) byT.set(t, []);
        for (const nr of list) {
          const k = tierKeyFromRow(nr);
          const bucket = byT.has(k) ? k : '_other';
          byT.get(bucket).push(nr);
        }
        for (const t of order) {
          const chunk = byT.get(t);
          if (!chunk.length) continue;
          const trg = el('tr', 'data-table__group');
          const tdg = el('td', null);
          tdg.colSpan = headers.length;
          tdg.textContent = t === '_other' ? 'Unknown tier' : t.charAt(0).toUpperCase() + t.slice(1);
          trg.appendChild(tdg);
          tbody.appendChild(trg);
          for (const r of chunk) appendDataRow(r);
        }
      } else {
        for (const r of list) appendDataRow(r);
      }
    }

    function appendDataRow(r) {
      const tr = el('tr');
      for (let i = 0; i < r.cells.length; i++) {
        const cell = r.cells[i];
        const td = el('td', headers[i].align === 'right' ? 'num' : null);
        if (cell instanceof Node) td.appendChild(cell);
        else td.textContent = cell;
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }

    function updateIndicators() {
      const ths = trh.querySelectorAll('th');
      ths.forEach((th, i) => {
        th.removeAttribute('aria-sort');
        const ind = th.querySelector('.th-sort__ind');
        if (!ind) return;
        ind.textContent = '';
        if (state.col !== i) return;
        ind.textContent = state.dir === 'desc' ? '▼' : '▲';
        th.setAttribute('aria-sort', state.dir === 'desc' ? 'descending' : 'ascending');
      });
    }

    for (let i = 0; i < headers.length; i++) {
      const h = headers[i];
      const th = el('th', h.align === 'right' ? 'num' : null);
      if (h.sort) {
        th.classList.add('th-sort');
        th.setAttribute('role', 'button');
        th.setAttribute('tabindex', '0');
        th.title = 'Sort by ' + h.label;
        const head = el('span', 'th-sort__head');
        head.appendChild(el('span', 'th-sort__label', h.label));
        if (h.help) head.appendChild(fieldHelp(h.help));
        th.appendChild(head);
        th.appendChild(el('span', 'th-sort__ind', ''));
        const activate = (ev) => {
          ev.preventDefault();
          if (state.col === i) state.dir = state.dir === 'desc' ? 'asc' : 'desc';
          else {
            state.col = i;
            state.dir = sortDefaults(i);
          }
          updateIndicators();
          renderBody();
        };
        th.addEventListener('click', activate);
        th.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter' || ev.key === ' ') activate(ev);
        });
      } else if (h.help) {
        const wrap = el('span', 'th-label-wrap');
        wrap.appendChild(document.createTextNode(h.label));
        wrap.appendChild(fieldHelp(h.help));
        th.appendChild(wrap);
      } else {
        th.textContent = h.label;
      }
      trh.appendChild(th);
    }

    thead.appendChild(trh);
    table.appendChild(thead);
    table.appendChild(tbody);
    wrap.appendChild(table);
    block.appendChild(wrap);
    parent.appendChild(block);

    copyBtn.addEventListener('click', () => {
      const tsv = tableToTsv(table);
      const prev = copyBtn.textContent;
      copyBtn.disabled = true;
      copyTextToClipboard(tsv).then(() => {
        copyBtn.textContent = 'Copied';
        setTimeout(() => {
          copyBtn.textContent = prev;
          copyBtn.disabled = false;
        }, 1400);
      }).catch(() => {
        copyBtn.textContent = 'Failed';
        setTimeout(() => {
          copyBtn.textContent = prev;
          copyBtn.disabled = false;
        }, 2000);
      });
    });

    if (groupSpec && groupSpec.onRebuild) groupSpec.onRebuild(renderBody);
    renderBody();
    return block;
  }

  function svgChart(w, h, pad) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.setAttribute('class', 'chart');
    svg._pad = pad;
    svg._w = w;
    svg._h = h;
    return svg;
  }

  function svgNs(tag) {
    return document.createElementNS('http://www.w3.org/2000/svg', tag);
  }

  function candleLegend(parent) {

  function renderDistributionCandles(parent, rows, opts) {
    if (!rows || !rows.length) return;
    const fmt = (opts && opts.valueFmt) || function(v) { return String(Math.round(v)); };
    const w = Math.max(520, rows.length * 22);
    const h = (opts && opts.height) || 220;
    const pad = { l: 52, r: 14, t: 14, b: 48 };
    const svg = svgChart(w, h, pad);
    const iw = w - pad.l - pad.r;
    const ih = h - pad.t - pad.b;
    let yMin = Infinity;
    let yMax = -Infinity;
    for (const r of rows) {
      yMin = Math.min(yMin, r.low, r.open, r.close, r.target != null ? r.target : Infinity);
      yMax = Math.max(yMax, r.high, r.open, r.close, r.target != null ? r.target : -Infinity);
    }
    if (!Number.isFinite(yMin) || !Number.isFinite(yMax)) return;
    const yPad = Math.max((yMax - yMin) * 0.08, 1);
    yMin -= yPad;
    yMax += yPad;
    const yR = Math.max(yMax - yMin, 1e-9);
    const yAt = (v) => pad.t + ih - ((v - yMin) / yR) * ih;
    const n = rows.length;
    const slotW = n > 0 ? iw / n : iw;
    const bodyW = Math.max(4, Math.min(14, slotW * 0.55));

    const axis = svgNs('line');
    axis.setAttribute('x1', pad.l);
    axis.setAttribute('x2', pad.l + iw);
    axis.setAttribute('y1', pad.t + ih);
    axis.setAttribute('y2', pad.t + ih);
    axis.setAttribute('class', 'chart-axis');
    svg.appendChild(axis);

    for (let gi = 0; gi <= 4; gi++) {
      const v = yMin + (yR * gi) / 4;
      const y = yAt(v);
      const grid = svgNs('line');
      grid.setAttribute('x1', pad.l);
      grid.setAttribute('x2', pad.l + iw);
      grid.setAttribute('y1', y);
      grid.setAttribute('y2', y);
      grid.setAttribute('class', 'chart-grid');
      svg.appendChild(grid);
      const t = svgNs('text');
      t.setAttribute('x', pad.l - 6);
      t.setAttribute('y', y + 3);
      t.setAttribute('text-anchor', 'end');
      t.setAttribute('class', 'chart-tick');
      t.textContent = fmt(v);
      svg.appendChild(t);
    }

    rows.forEach((row, i) => {
      const cx = pad.l + slotW * (i + 0.5);
      if (row.target != null && Number.isFinite(row.target)) {
        const ty = yAt(row.target);
        const tl = svgNs('line');
        tl.setAttribute('x1', cx - slotW * 0.42);
        tl.setAttribute('x2', cx + slotW * 0.42);
        tl.setAttribute('y1', ty);
        tl.setAttribute('y2', ty);
        tl.setAttribute('class', 'candle-target');
        tl.title = 'Target ' + fmt(row.target);
        svg.appendChild(tl);
      }
      const wick = svgNs('line');
      wick.setAttribute('x1', cx);
      wick.setAttribute('x2', cx);
      wick.setAttribute('y1', yAt(row.high));
      wick.setAttribute('y2', yAt(row.low));
      wick.setAttribute('class', 'candle-wick');
      wick.title = 'low ' + fmt(row.low) + ' · high ' + fmt(row.high);
      svg.appendChild(wick);
      const top = yAt(Math.max(row.open, row.close));
      const bot = yAt(Math.min(row.open, row.close));
      const bodyH = Math.max(2, bot - top);
      const body = svgNs('rect');
      body.setAttribute('x', cx - bodyW / 2);
      body.setAttribute('y', top);
      body.setAttribute('width', bodyW);
      body.setAttribute('height', bodyH);
      body.setAttribute('class', 'candle-body ' + (row.close >= row.open ? 'candle-body--up' : 'candle-body--down'));
      body.title = 'Q1 ' + fmt(row.open) + ' · Q3 ' + fmt(row.close) + ' (n=' + row.n + ')';
      svg.appendChild(body);
    });

    const step = Math.max(1, Math.ceil(n / 28));
    rows.forEach((row, i) => {
      if (i % step !== 0 && i !== n - 1) return;
      const t = svgNs('text');
      t.setAttribute('x', pad.l + slotW * (i + 0.5));
      t.setAttribute('y', h - 8);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('class', 'chart-tick');
      t.textContent = row.label;
      svg.appendChild(t);
    });

    candleLegend(parent);
    parent.appendChild(svg);
  }


  function slotLabelShort(slot) {
    const parts = String(slot || '').split('-');
    if (parts.length < 2) return slot;
    const ante = parseInt(parts[0], 10);
    const blind = parts.slice(1).join('-').trim();
    const m = { 'Small Blind': 'S', 'Big Blind': 'B', 'Boss Blind': 'X' };
    return 'A' + (Number.isFinite(ante) ? ante : '?') + ' ' + (m[blind] || blind.slice(0, 6));
  }

  function renderHorizontalBars(parent, items, opts) {

  function renderAnteDeathChart(parent, marginal, hazard) {
    const marg = marginal || [];
    const haz = hazard || [];
    const margMap = new Map(marg.map((r) => [r.ante, r]));
    const hazMap = new Map(haz.map((r) => [r.ante, r]));
    const antes = [...new Set([...margMap.keys(), ...hazMap.keys()])].sort((a, b) => a - b);
    if (!antes.length) return;
    chartLegend(parent, [
      { color: '#4db8e8', label: '% of all runs (marginal)' },
      { color: '#e8a06e', label: 'Hazard | reached ante' }
    ]);
    const w = Math.max(440, antes.length * 38);
    const h = 200;
    const pad = { l: 44, r: 12, t: 10, b: 40 };
    const svg = svgChart(w, h, pad);
    const iw = w - pad.l - pad.r;
    const ih = h - pad.t - pad.b;
    const yMax = 100;
    const groupW = iw / antes.length;
    const barW = Math.max(4, Math.min(11, groupW * 0.2));
    const gap = 2;
    const axis = svgNs('line');
    axis.setAttribute('x1', pad.l);
    axis.setAttribute('x2', pad.l + iw);
    axis.setAttribute('y1', pad.t + ih);
    axis.setAttribute('y2', pad.t + ih);
    axis.setAttribute('class', 'chart-axis');
    svg.appendChild(axis);
    for (let gi = 0; gi <= 4; gi++) {
      const v = (yMax * gi) / 4;
      const y = pad.t + ih - (v / yMax) * ih;
      const grid = svgNs('line');
      grid.setAttribute('x1', pad.l);
      grid.setAttribute('x2', pad.l + iw);
      grid.setAttribute('y1', y);
      grid.setAttribute('y2', y);
      grid.setAttribute('class', 'chart-grid');
      svg.appendChild(grid);
    }
    antes.forEach((ante, i) => {
      const cx = pad.l + groupW * (i + 0.5);
      const m = margMap.get(ante);
      const hz = hazMap.get(ante);
      if (m) {
        const bh = (m.pct_of_runs / yMax) * ih;
        const r = svgNs('rect');
        r.setAttribute('x', cx - barW - gap / 2);
        r.setAttribute('y', pad.t + ih - bh);
        r.setAttribute('width', barW);
        r.setAttribute('height', Math.max(0, bh));
        r.setAttribute('fill', '#4db8e8');
        r.title = 'Marginal: ' + m.pct_of_runs.toFixed(1) + '% of runs (' + m.count + ' deaths)';
        svg.appendChild(r);
      }
      if (hz) {
        const bh = (hz.hazard_pct / yMax) * ih;
        const r = svgNs('rect');
        r.setAttribute('x', cx + gap / 2);
        r.setAttribute('y', pad.t + ih - bh);
        r.setAttribute('width', barW);
        r.setAttribute('height', Math.max(0, bh));
        r.setAttribute('fill', '#e8a06e');
        r.title = 'Hazard: ' + hz.hazard_pct.toFixed(1) + '% (' + hz.deaths + '/' + hz.reached + ')';
        svg.appendChild(r);
      }
      const t = svgNs('text');
      t.setAttribute('x', cx);
      t.setAttribute('y', h - 6);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('class', 'chart-tick');
      t.textContent = 'A' + ante;
      svg.appendChild(t);
    });
    parent.appendChild(svg);
  }

  function renderReport(data) {
    const runs = data.runs;
    const mode = data.mode || {};
    const sums = (data.aggregate && data.aggregate.sums) || {};
    const d = data.derived || {};
    const pr = d.per_run || {};
    const meta = data.meta || {};

    const HELP_WILSON_CI = 'Wilson 95% interval for a binomial proportion (the rate implied by this row’s counts). Wide bands mean few trials; standard frequentist CI, not a Bayesian credible interval.';
    const HELP_WILSON_WIN_RATE = 'Wilson 95% interval for wins ÷ buys on this row (only defined when bought ≥ 1).';

    document.title = 'Mahjuro bot — ' + runs + ' runs';

    const stake = mode.stake != null ? String(mode.stake) : '—';

    const header = el('header', 'dash-header');

    code.style.color = 'var(--accent)';

    header.appendChild(brand);
    const header_chips = el('div', 'dash-header__chips');

    if (meta.crate_version) header_chips.appendChild(el('span', 'chip', meta.crate_version));

    if (mode.tile_material != null) {

      baselineNote += '% late = share of this relic’s shop buys when run.ante > ' + anteMx + ' at purchase.';

      const sec = card('Relics', 'Wilson CIs on conditional win rate; use Δ and % late to spot survivorship — not relic power.');
      const toolbar = el('div', 'table-toolbar');
      const groupCb = el('input');
      groupCb.type = 'checkbox';
      groupCb.id = 'mahjuro-relic-tier-group';
      const groupLb = el('label');
      groupLb.htmlFor = 'mahjuro-relic-tier-group';
      groupLb.textContent = 'Group relic rows by shop tier';
      toolbar.appendChild(groupCb);
      toolbar.appendChild(groupLb);
      sec.body.appendChild(toolbar);
      sec.body.appendChild(el('p', 'prose', baselineNote));
      const tierGroupRebuild = [];
      groupCb.addEventListener('change', () => {
        for (const fn of tierGroupRebuild) fn();
      });

      function fmtDeltaVsBase(row) {
        const v = row.delta_vs_baseline_pct;
        if (v == null || !Number.isFinite(v)) return '—';
        return el('span', v >= 0 ? 'delta-pos' : 'delta-neg', (v >= 0 ? '+' : '') + v.toFixed(1));
      }
      function fmtPctLate(row) {
        const p = row.pct_shop_late;
        if (p == null || !Number.isFinite(p)) return '—';
        return p.toFixed(0) + '%';
      }

      function relicMainHeaders() {
        return [
          { label: 'Relic', sort: 'str', sortDefault: 'asc' },
          { label: 'Tier', sort: 'tier', sortDefault: 'desc' },
          { label: 'Bought', sort: 'num', sortDefault: 'desc', align: 'right' },
          { label: 'Won', sort: 'num', sortDefault: 'desc', align: 'right' },
          { label: 'Win%', sort: 'pct', sortDefault: 'desc', align: 'right',
            help: 'Runs that won and bought this relic at least once ÷ runs that bought it at least once.' },
          { label: '95% CI', sort: 'str', sortDefault: 'asc', align: 'right', help: HELP_WILSON_WIN_RATE },
          { label: 'Δ', sort: 'num', sortDefault: 'desc', align: 'right',
            help: 'This row’s Win% minus the batch overall win rate (percentage points). Strong selection bias — not causal relic power.' },
          { label: '% late', sort: 'num', sortDefault: 'desc', align: 'right',
            help: 'Among this relic’s shop buys, fraction where run.ante > ' + anteMx + ' at purchase (see card prose).' }
        ];
      }
      const boughtRows = d.relics_bought.map((row) => {
        const slug = (row.rarity && String(row.rarity)) || '';
        const dlt = row.delta_vs_baseline_pct;
        const late = row.pct_shop_late;
        return {
          raritySlug: slug,
          cells: [
            row.name,
            formatTier(slug),
            String(row.bought),
            String(row.won),
            row.win_pct.toFixed(1) + '%',
            fmtWilson(row.win_pct_ci_lo, row.win_pct_ci_hi),
            fmtDeltaVsBase(row),
            fmtPctLate(row)
          ],
          keys: [
            row.name.toLowerCase(),
            rarityRank(slug),
            row.bought,
            row.won,
            row.win_pct,
            null,
            (dlt != null && Number.isFinite(dlt)) ? dlt : -1e9,
            (late != null && Number.isFinite(late)) ? late : -1
          ]
        };
      });
      addTable(sec.body, relicMainHeaders(), boughtRows, {
        group: {
          enabled: () => groupCb.checked,
          tierOf: (nr) => {
            const s = (nr.raritySlug || '').toLowerCase();
            return RELIC_TIER_ORDER.indexOf(s) !== -1 ? s : '_other';
          },
          onRebuild: (fn) => { tierGroupRebuild.push(fn); }
        }
      });

      if ((d.relics_by_win_rate || []).length) {
        const baseline = baselinePct.toFixed(1);
        sec.body.appendChild(el('h3', 'dash-card__subhead', '≥20 buys (same columns; sorted by win%) · baseline ' + baseline + '%'));
        const deltaHdr = relicMainHeaders();
        const deltaRows = d.relics_by_win_rate.map((row) => {
          const slug = (row.rarity && String(row.rarity)) || '';
          const dlt = row.delta_vs_baseline_pct;
          const late = row.pct_shop_late;
          return {
            raritySlug: slug,
            cells: [
              row.name,
              formatTier(slug),
              String(row.bought),
              String(row.won),
              row.win_pct.toFixed(1) + '%',
              fmtWilson(row.win_pct_ci_lo, row.win_pct_ci_hi),
              fmtDeltaVsBase(row),
              fmtPctLate(row)
            ],
            keys: [
              row.name.toLowerCase(),
              rarityRank(slug),
              row.bought,
              row.won,
              row.win_pct,
              null,
              (dlt != null && Number.isFinite(dlt)) ? dlt : -1e9,
              (late != null && Number.isFinite(late)) ? late : -1
            ]
          };
        });
        addTable(sec.body, deltaHdr, deltaRows, {
          group: {
            enabled: () => groupCb.checked,
            tierOf: (nr) => {
              const s = (nr.raritySlug || '').toLowerCase();
              return RELIC_TIER_ORDER.indexOf(s) !== -1 ? s : '_other';
            },
            onRebuild: (fn) => { tierGroupRebuild.push(fn); }
          }
        });
      }

      if ((d.relics_shop_timing_split || []).length) {
        const minB = d.relic_shop_timing_min_per_bucket;
        sec.body.appendChild(el('h3', 'dash-card__subhead',
          'Shop timing split (≥' + minB + ' buys in each bucket · early ante≤' + anteMx + ', late ante>' + anteMx + ')'));
        const splitHdr = [
          { label: 'Relic', sort: 'str', sortDefault: 'asc' },
          { label: 'Tier', sort: 'tier', sortDefault: 'desc' },
          { label: 'Early N', sort: 'num', sortDefault: 'desc', align: 'right',
            help: 'Shop purchases of this relic when run.ante ≤ ' + anteMx + ' at the visit.' },
          { label: 'Early win%', sort: 'pct', sortDefault: 'desc', align: 'right',
            help: 'Wins ÷ Early N for runs that bought the relic in that early bucket.' },
          { label: 'Early CI', sort: 'str', sortDefault: 'asc', align: 'right',
            help: 'Wilson 95% interval for the early-bucket win rate (wins ÷ Early N).' },
          { label: 'Late N', sort: 'num', sortDefault: 'desc', align: 'right',
            help: 'Purchases when run.ante > ' + anteMx + ' at the shop.' },
          { label: 'Late win%', sort: 'pct', sortDefault: 'desc', align: 'right',
            help: 'Wins ÷ Late N.' },
          { label: 'Late CI', sort: 'str', sortDefault: 'asc', align: 'right',
            help: 'Wilson 95% interval for the late-bucket win rate (wins ÷ Late N). Compare to Early CI; gaps often mix timing and survivorship, not just relic effect.' },
          { label: 'Late−early', sort: 'num', sortDefault: 'desc', align: 'right',
            help: 'Late win% minus early win%, in percentage points.' }
        ];
        const splitRows = d.relics_shop_timing_split.map((row) => {
          const slug = (row.rarity && String(row.rarity)) || '';
          const gap = row.timing_gap_pct;
          const gapCell = (gap != null && Number.isFinite(gap))
            ? el('span', gap >= 0 ? 'delta-pos' : 'delta-neg', (gap >= 0 ? '+' : '') + gap.toFixed(1))
            : '—';
          return {
            raritySlug: slug,
            cells: [
              row.name,
              formatTier(slug),
              String(row.early_bought),
              row.early_win_pct.toFixed(1) + '%',
              fmtWilson(row.early_win_pct_ci_lo, row.early_win_pct_ci_hi),
              String(row.late_bought),
              row.late_win_pct.toFixed(1) + '%',
              fmtWilson(row.late_win_pct_ci_lo, row.late_win_pct_ci_hi),
              gapCell
            ],
            keys: [
              row.name.toLowerCase(),
              rarityRank(slug),
              row.early_bought,
              row.early_win_pct,
              null,
              row.late_bought,
              row.late_win_pct,
              null,
              (gap != null && Number.isFinite(gap)) ? gap : -1e9
            ]
          };
        });
        addTable(sec.body, splitHdr, splitRows, {
          group: {
            enabled: () => groupCb.checked,
            tierOf: (nr) => {
              const s = (nr.raritySlug || '').toLowerCase();
              return RELIC_TIER_ORDER.indexOf(s) !== -1 ? s : '_other';
            },
            onRebuild: (fn) => { tierGroupRebuild.push(fn); }
          }
        });
      }
      full.appendChild(sec.section);
    }

    function fmtHist(hist) {
      if (!hist || !hist.length) return '—';
      return hist.map((b) => b.name + ':' + b.count).join(' ');
    }

    if ((d.relics_shop_funnel || []).length) {
      const sec = card('Relic shop funnel', 'Stock appearances vs buys; take rate and bot marginal at purchase.');
      const hdr = [
        { label: 'Relic', sort: 'str', sortDefault: 'asc' },
        { label: 'Tier', sort: 'tier', sortDefault: 'desc' },
        { label: 'Offers', sort: 'num', sortDefault: 'desc', align: 'right',
          help: 'Times this relic appeared in shop stock across all visits.' },
        { label: 'Bought', sort: 'num', sortDefault: 'desc', align: 'right' },
        { label: 'Take%', sort: 'pct', sortDefault: 'desc', align: 'right',
          help: 'Bought ÷ offers. Low take with high offers → bot undervalues.' },
        { label: 'Avg marginal', sort: 'num', sortDefault: 'desc', align: 'right',
          help: 'Mean bot marginal-value estimate at purchase time (score units, ante-scaled).' }
      ];
      const rows = d.relics_shop_funnel.map((row) => {
        const slug = (row.rarity && String(row.rarity)) || '';
        return {
          raritySlug: slug,
          cells: [row.name, formatTier(slug), String(row.offers), String(row.bought),
            row.take_rate_pct.toFixed(1) + '%', row.avg_marginal_at_buy.toFixed(0)],
          keys: [row.name.toLowerCase(), rarityRank(slug), row.offers, row.bought, row.take_rate_pct, row.avg_marginal_at_buy]
        };
      });
      addTable(sec.body, hdr, rows);
      full.appendChild(sec.section);
    }

    if ((d.relics_value_analysis || []).length) {
      const sec = card('Relic valuations', 'Marginal at buy and hold at sell (bot estimates); histogram bucket counts.');
      const hdr = [
        { label: 'Relic', sort: 'str', sortDefault: 'asc' },
        { label: 'Buys', sort: 'num', sortDefault: 'desc', align: 'right' },
        { label: 'Avg marginal', sort: 'num', sortDefault: 'desc', align: 'right' },
        { label: 'Marginal range', sort: 'str', sortDefault: 'asc' },
        { label: 'Marginal hist', sort: 'str', sortDefault: 'asc',
          help: 'Bucket counts: <0, 0, 1–499, 500–999, 1k–5k, 5k+.' },
        { label: 'Sells', sort: 'num', sortDefault: 'desc', align: 'right' },
        { label: 'Avg hold', sort: 'num', sortDefault: 'desc', align: 'right' },
        { label: 'Hold hist', sort: 'str', sortDefault: 'asc' }
      ];
      const rows = d.relics_value_analysis.map((row) => {
        const range = (row.min_marginal != null && row.max_marginal != null)
          ? row.min_marginal + '…' + row.max_marginal : '—';
        return {
          cells: [row.name, String(row.buy_count), row.avg_marginal.toFixed(0), range,
            fmtHist(row.marginal_hist), String(row.sell_count), row.avg_hold.toFixed(0), fmtHist(row.hold_hist)],
          keys: [row.name.toLowerCase(), row.buy_count, row.avg_marginal, range, '', row.sell_count, row.avg_hold, '']
        };
      });
      addTable(sec.body, hdr, rows);
      full.appendChild(sec.section);
    }

    if ((d.relics_depth_split || []).length) {
      const sec = card('Relic depth split', 'Avg antes cleared on runs that bought vs never bought each relic (observational).');
      sec.body.appendChild(el('p', 'prose',
        'Δ antes = avg depth when bought minus avg when never bought. Positive Δ often means the relic correlates with longer runs; not causal.'));
      const hdr = [
        { label: 'Relic', sort: 'str', sortDefault: 'asc' },
        { label: 'Runs w/', sort: 'num', sortDefault: 'desc', align: 'right' },
        { label: 'Antes w/', sort: 'num', sortDefault: 'desc', align: 'right' },
        { label: 'Runs w/o', sort: 'num', sortDefault: 'desc', align: 'right' },
        { label: 'Antes w/o', sort: 'num', sortDefault: 'desc', align: 'right' },
        { label: 'Δ antes', sort: 'num', sortDefault: 'desc', align: 'right' }
      ];
      const rows = d.relics_depth_split.filter((row) => row.runs_with > 0).slice(0, 40).map((row) => {
        const dlt = row.delta_antes;
        const dltCell = el('span', dlt >= 0 ? 'delta-pos' : 'delta-neg', (dlt >= 0 ? '+' : '') + dlt.toFixed(2));
        return {
          cells: [row.name, String(row.runs_with), row.avg_antes_with.toFixed(2),
            String(row.runs_without), row.avg_antes_without.toFixed(2), dltCell],
          keys: [row.name.toLowerCase(), row.runs_with, row.avg_antes_with, row.runs_without, row.avg_antes_without, dlt]
        };
      });
      addTable(sec.body, hdr, rows);
      full.appendChild(sec.section);
    }

    if ((d.relics_score_attribution || []).length) {
      const sec = card('Relic score attribution', 'Points from relic-named scoring steps on committed plays (chips vs mult split).');
      const hdr = [
        { label: 'Relic', sort: 'str', sortDefault: 'asc' },
        { label: 'Triggers', sort: 'num', sortDefault: 'desc', align: 'right' },
        { label: 'Score pts', sort: 'num', sortDefault: 'desc', align: 'right' },
        { label: 'Chips', sort: 'num', sortDefault: 'desc', align: 'right' },
        { label: 'Mult pts', sort: 'num', sortDefault: 'desc', align: 'right' },
        { label: 'Pts/trigger', sort: 'num', sortDefault: 'desc', align: 'right' },
        { label: 'Pts/run', sort: 'num', sortDefault: 'desc', align: 'right' }
      ];
      const rows = d.relics_score_attribution.slice(0, 30).map((row) => ({
        cells: [row.name, String(row.triggers), String(row.score_pts), String(row.chips_pts),
          String(row.mult_pts), row.pts_per_trigger.toFixed(0), row.pts_per_run.toFixed(0)],
        keys: [row.name.toLowerCase(), row.triggers, row.score_pts, row.chips_pts, row.mult_pts, row.pts_per_trigger, row.pts_per_run]
      }));
      addTable(sec.body, hdr, rows);
      full.appendChild(sec.section);
    }

    const hasShop = (d.talismans_shop || []).length || (d.zodiacs_shop || []).length || (d.packs_shop || []).length;
    if (hasShop) {
      const shop = card('Shop purchases', 'Total buys per item; bar length = count (label shows per-run rate).');
      function shopBars(rows) {
        return (rows || []).map((row) => ({
          name: row.name,
          v: row.count,
          display: row.per_run.toFixed(2) + '/run (' + row.count + ')',
          title: row.count + ' total'
        }));
      }
      if ((d.talismans_shop || []).length) {
        shop.body.appendChild(el('h3', 'dash-card__subhead', 'Talismans'));
        renderHorizontalBars(shop.body, shopBars(d.talismans_shop));
      }
      if ((d.zodiacs_shop || []).length) {
        shop.body.appendChild(el('h3', 'dash-card__subhead', 'Zodiacs'));
        renderHorizontalBars(shop.body, shopBars(d.zodiacs_shop));
      }
      if ((d.packs_shop || []).length) {
        shop.body.appendChild(el('h3', 'dash-card__subhead', 'Packs'));
        renderHorizontalBars(shop.body, shopBars(d.packs_shop));
      }
      full.appendChild(shop.section);
    }

    if (d.yaku) {
      const y = d.yaku;
      const sec = card('Yaku distribution',
        'Total ' + y.total_awards + ' awards (' + y.awards_per_run.toFixed(2) + '/run); uniform ' + y.uniform_baseline_pct.toFixed(1) + '% · ' + y.kind_count + ' kinds');
      const yakuBars = y.rows.map((row) => ({
        name: row.name,
        v: row.share_pct,
        display: row.share_pct.toFixed(1) + '% · ' + row.per_run.toFixed(2) + '/run',
        title: row.awards + ' awards; Δ uni ' + (row.delta_uniform_pct >= 0 ? '+' : '') + row.delta_uniform_pct.toFixed(1) + '%'
      }));
      renderHorizontalBars(sec.body, yakuBars, { warm: true });
      addDetailsTable(sec.body, 'Full yaku table (sortable)', (body) => {
      addTable(body,
        [
          { label: 'Yaku', sort: 'str', sortDefault: 'asc' },
          { label: 'Awards', sort: 'num', align: 'right' },
          { label: '/run', sort: 'num', align: 'right',
            help: 'Mean awards of this yaku per run (Awards ÷ runs).' },
          { label: 'Share', sort: 'pct', align: 'right',
            help: 'This yaku’s awards ÷ all yaku awards in the batch.' },
          { label: 'Δ uni', sort: 'pct', align: 'right',
            help: 'Share minus a uniform baseline (100% ÷ yaku kind count). Positive = more common than equal-split null.' }
        ],
        y.rows.map((row) => {
          const cell = el('span', row.delta_uniform_pct >= 0 ? 'delta-pos' : 'delta-neg',
            (row.delta_uniform_pct >= 0 ? '+' : '') + row.delta_uniform_pct.toFixed(1) + '%');
          return {
            cells: [row.name, String(row.awards), row.per_run.toFixed(2), row.share_pct.toFixed(1) + '%', cell],
            keys: [row.name.toLowerCase(), row.awards, row.per_run, row.share_pct, row.delta_uniform_pct]
          };
        }));
      });
      if ((y.never_awarded || []).length) {
        sec.body.appendChild(el('p', 'prose', 'Never awarded (' + y.never_awarded.length + ' kinds): ' + y.never_awarded.join(', ')));
      }
      full.appendChild(sec.section);
    }

    if (d.bot_issues) {
      const bi = d.bot_issues;
      const sec = card('Bot terminal issues', 'Dead-ends and diagnostics');
      if (bi.dead_end_total > 0) {
        sec.body.appendChild(el('p', 'prose', 'Dead-ends: total ' + bi.dead_end_total +
          ' · no-valid ' + bi.no_valid + ' · unplayable-only ' + bi.only_unplayable +
          ' · no-score-only ' + bi.only_no_score + ' · other ' + bi.other));
      }
      if (bi.lost_with_lines > 0) sec.body.appendChild(el('p', 'prose', 'Lost with scoring lines available: ' + bi.lost_with_lines));
      function barSection(label, pairs) {
        if (!pairs || !pairs.length) return;
        sec.body.appendChild(el('h3', 'dash-card__subhead', label));
        renderHorizontalBars(sec.body, pairs.map(([name, count]) => ({
          name: name,
          v: count,
          display: String(count)
        })));
      }
      if (bi.dead_end_total > 0) {
        barSection('Dead-end mix', [
          ['No valid hand', bi.no_valid],
          ['Only unplayable', bi.only_unplayable],
          ['Only no-score', bi.only_no_score],
          ['Other', bi.other]
        ].filter(([, c]) => c > 0));
      }
      barSection('Hottest blinds', bi.hottest_blinds);
      barSection('Hottest bosses', bi.hottest_bosses);
      barSection('Reasons', bi.reasons_top);
      full.appendChild(sec.section);
    }

    for (const tbl of d.supplementary_tables || []) {
      if (!tbl.rows || !tbl.rows.length) continue;
      const sec = card(tbl.title, 'From aggregate.maps');
      renderHorizontalBars(sec.body, namedCountToBars(tbl.rows));
      full.appendChild(sec.section);
    }

    app.appendChild(full);

    const foot = el('p', 'foot-note',
      'Wilson intervals are for binomial proportions. Relic Δ and timing splits still reflect shop selection and run state — not causal power. For bootstraps / FDR on JSONL, see tools/bot_jsonl_stats.py.');
    app.appendChild(foot);
  }

  try {
    const data = loadPayload();
    if (data.schema_version !== EXPECTED_SCHEMA_VERSION) {
      app.appendChild(el('div', 'error', 'Expected export schema_version ' + EXPECTED_SCHEMA_VERSION + '; got ' + data.schema_version + '. Re-run: mahjuro bot -o report.html'));
    } else {
      renderReport(data);
    }
  } catch (e) {
    app.appendChild(el('div', 'error', 'Failed to load embedded bot JSON: ' + e));
  }
})();
</script>
</body>
</html>
