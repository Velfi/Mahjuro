[package]
name = "mahjuro-headless"
version.workspace = true
edition.workspace = true
description = "Offscreen GPU tools for Mahjuro (room bakes + screenshots)"
publish.workspace = true

[features]
default = ["bake"]
bake = [
    "mahjuro-render/bake",
    "mahjuro/offline-bake-support",
    "mahjuro/headless-screenshot",
]
screenshot = ["mahjuro/headless-screenshot"]

[dependencies]
mahjuro.workspace = true
mahjuro-render.workspace = true
mahjuro-assets.workspace = true
mahjuro-bake-stamp.workspace = true
anyhow.workspace = true
clap.workspace = true
env_logger.workspace = true
image = { workspace = true, features = ["png"] }
log.workspace = true
rustc-hash.workspace = true
zstd.workspace = true

[[bin]]
name = "mahjuro-bake"
path = "src/bin/mahjuro-bake.rs"
required-features = ["bake"]

[[bin]]
name = "mahjuro-screenshot"
path = "src/bin/mahjuro-screenshot.rs"
required-features = ["screenshot"]
