[package]
name = "mahjuro-headless"
version = "0.5.0-21"
edition = "2024"
description = "Offscreen GPU tools for Mahjuro (room bakes + screenshots)"
publish = false

[features]
default = []
bake = ["mahjuro/bake-support"]
screenshot = ["mahjuro/headless-screenshot"]

[dependencies]
mahjuro = { path = "../..", default-features = false }
mahjuro-render = { path = "../mahjuro-render" }
mahjuro-assets = { path = "../mahjuro-assets" }
anyhow = "1.0.102"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11.8"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4.28"
rustc-hash = "2.1"

[[bin]]
name = "mahjuro-bake"
path = "src/bin/mahjuro-bake.rs"
required-features = ["bake"]

[[bin]]
name = "mahjuro-screenshot"
path = "src/bin/mahjuro-screenshot.rs"
required-features = ["screenshot"]
