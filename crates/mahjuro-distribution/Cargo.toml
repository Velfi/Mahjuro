[package]
name = "mahjuro-distribution"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
steam = ["dep:steamworks"]
macos-store = []
windows-store = ["dep:cxx"]

[dependencies]
mahjuro-core.workspace = true
cxx = { version = "1.0", optional = true }
dirs.workspace = true
enum_dispatch.workspace = true
log.workspace = true
steamworks = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSError",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSApplication",
    "NSPanel",
    "NSResponder",
    "NSSavePanel",
    "NSWindow",
    "NSWorkspace",
] }
objc2-game-kit = { version = "0.3", default-features = false, features = [
    "GKBasePlayer",
    "GKAchievement",
    "GKLocalPlayer",
    "GKPlayer",
    "block2",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
cc = "1.2"
