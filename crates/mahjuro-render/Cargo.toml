[package]
name = "mahjuro-render"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "mahjuro-bake-decal-atlases"
path = "src/bin/mahjuro-bake-decal-atlases.rs"

[[bin]]
name = "mahjuro-bake-relics"
path = "src/bin/mahjuro-bake-relics.rs"

[features]
default = []
clipboard = ["dep:arboard"]
relic_bc7_bake = ["dep:intel_tex_2"]
# SDL window/surface path for the interactive game; off for CPU-only bake binaries.
windowed = ["dep:sdl3"]
# Headless room/shadow bakes via mahjuro-headless (relaxes strict main_menu init).
bake = []

[dependencies]
arboard = { workspace = true, optional = true }
mahjuro-core.workspace = true
mahjuro-types.workspace = true
mahjuro-assets.workspace = true
mahjuro-gfx-types.workspace = true
mahjuro-bake-stamp.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
fontdue.workspace = true
glam.workspace = true
gltf.workspace = true
image = { workspace = true, features = ["png", "jpeg", "bmp", "gif", "webp"] }
log.workspace = true
env_logger.workspace = true
parking_lot.workspace = true
pollster.workspace = true
rand.workspace = true
raw-window-handle.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
ttf-parser.workspace = true
wgpu.workspace = true
wgpu-hal.workspace = true
lyon_path.workspace = true
lyon_tessellation.workspace = true
chrono.workspace = true
sdl3 = { workspace = true, optional = true }
crossbeam-channel.workspace = true
bumpalo.workspace = true
memmap2.workspace = true
zstd.workspace = true
lru.workspace = true
intel_tex_2 = { version = "0.5", optional = true }
