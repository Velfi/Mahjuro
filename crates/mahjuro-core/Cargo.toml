[package]
name = "mahjuro-core"
version = "0.5.0-21"
edition = "2024"
publish = false

[dependencies]
mahjuro-assets = { path = "../mahjuro-assets" }
mahjuro-gfx-types = { path = "../mahjuro-gfx-types" }
mahjuro-types = { path = "../mahjuro-types" }
anyhow = "1.0.102"
glam = { version = "0.30.9", features = ["bytemuck"] }
log = "0.4.28"
rand = "0.10.0"
rustc-hash = "2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"

[dev-dependencies]
proptest = "1.6"
