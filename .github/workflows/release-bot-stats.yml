# After each published GitHub Release, run a 20k bot simulation on the
# release tag and open a PR that updates docs/bot_stats_20k.html.
#
# Builds a Linux release binary on ubuntu-latest (no Linux GitHub release
# artifact — releases are Windows and macOS only).

name: Release bot stats (20k)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to simulate (e.g. v0.5.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bot-stats-20k-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  bot-stats-20k:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}
          lfs: false

      - uses: ./.github/actions/hydrate-lfs-bundle

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxcursor-dev \
            libvulkan-dev \
            libgtk-3-dev \
            libxdo-dev

      - name: Linux — swap and compile job limit
        run: |
          SWAPFILE=/home/runner/cargo_extra.swap
          sudo fallocate -l 8G "$SWAPFILE" || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=8192 status=none
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"

      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          prefix-key: bot-stats-20k
          key: x86_64-unknown-linux-gnu

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Run 20k bot simulation
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ github.workspace }}/docs/bot_stats_20k.html"
          BIN="target/x86_64-unknown-linux-gnu/release/mahjuro"
          ( cd "$(dirname "$BIN")" && ./"$(basename "$BIN")" bot 20000 -o "$OUT" )

      - name: Open PR with bot stats HTML
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "docs: bot stats (20k) for ${{ steps.tag.outputs.tag }}"
          branch: ci/bot-stats-20k-${{ steps.tag.outputs.tag }}
          delete-branch: true
          title: "Bot stats: 20k run for ${{ steps.tag.outputs.tag }}"
          body: |
            Automated 20,000-run bot report for tag **${{ steps.tag.outputs.tag }}** (same commit as that release).

            Built from source on Linux (`cargo build --release` at that tag, then `./mahjuro bot 20000`).
          add-paths: docs/bot_stats_20k.html
