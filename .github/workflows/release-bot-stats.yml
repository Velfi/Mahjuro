# After each published GitHub Release, run a 20k bot simulation on the
# release tag and open a PR that updates docs/bot_stats_20k.html.
#
# Uses the Linux update tarball from that release (same artifact as release.yml)
# instead of compiling — requires the tag to have a published release with
# `mahjuro-<tag>-linux-x86_64.tar.gz` (workflow_dispatch on a bare tag will fail).

name: Release bot stats (20k)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag with Linux tarball asset (e.g. v0.5.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bot-stats-20k-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  bot-stats-20k:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}
          lfs: false

      # Match release-linux.yml link-time deps so the published binary’s shared
      # libraries resolve (no compile on this job).
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxcursor-dev \
            libvulkan-dev \
            libgtk-3-dev \
            libxdo-dev

      - name: Download Linux release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          ARCHIVE="mahjuro-${TAG}-linux-x86_64.tar.gz"
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$ARCHIVE" \
            --clobber
          mkdir -p mahjuro-bundle
          tar -xzf "$ARCHIVE" -C mahjuro-bundle

      - name: Run 20k bot simulation
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ github.workspace }}/docs/bot_stats_20k.html"
          ( cd mahjuro-bundle && ./mahjuro bot 20000 -o "$OUT" )

      - name: Open PR with bot stats HTML
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "docs: bot stats (20k) for ${{ steps.tag.outputs.tag }}"
          branch: ci/bot-stats-20k-${{ steps.tag.outputs.tag }}
          delete-branch: true
          title: "Bot stats: 20k run for ${{ steps.tag.outputs.tag }}"
          body: |
            Automated 20,000-run bot report for tag **${{ steps.tag.outputs.tag }}** (same commit as that release).

            Generated with the published Linux bundle `mahjuro-${{ steps.tag.outputs.tag }}-linux-x86_64.tar.gz` (`./mahjuro bot 20000`).
          add-paths: docs/bot_stats_20k.html
