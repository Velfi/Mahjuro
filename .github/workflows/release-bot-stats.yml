# After each published GitHub Release, run a 100k bot simulation on the
# release tag and open a PR that updates docs/bot_stats_100k.html.

name: Release bot stats (100k)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and run against (e.g. v0.5.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bot-stats-100k-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  bot-stats-100k:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxcursor-dev \
            libvulkan-dev \
            libgtk-3-dev \
            libxdo-dev \
            libfuse2

      - name: Linux — swap and compile job limit
        run: |
          SWAPFILE=/home/runner/cargo_extra.swap
          sudo fallocate -l 8G "$SWAPFILE" || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=8192 status=none
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"

      - name: Cache Cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: x86_64-unknown-linux-gnu-cargo-release-bot-stats-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            x86_64-unknown-linux-gnu-cargo-release-bot-stats-
            x86_64-unknown-linux-gnu-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Run 100k bot simulation
        run: ./target/release/mahjuro bot 100000 -o docs/bot_stats_100k.html

      - name: Open PR with bot stats HTML
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "docs: bot stats (100k) for ${{ steps.tag.outputs.tag }}"
          branch: ci/bot-stats-100k-${{ steps.tag.outputs.tag }}
          delete-branch: true
          title: "Bot stats: 100k run for ${{ steps.tag.outputs.tag }}"
          body: |
            Automated 100,000-run bot report for tag **${{ steps.tag.outputs.tag }}** (same commit as that release).

            Generated with `./target/release/mahjuro bot 100000 -o docs/bot_stats_100k.html`.
          add-paths: docs/bot_stats_100k.html
