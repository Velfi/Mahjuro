name: Release build (Linux)

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # Pinned; install from GitHub releases (apt package often missing on hosted runners).
  OXIPNG_VERSION: "10.1.1"

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Release Linux
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          lfs: false

      - uses: ./.github/actions/hydrate-lfs-bundle

      - name: Compute version (strip leading v)
        id: version
        shell: bash
        run: |
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxcursor-dev \
            libvulkan-dev \
            libgtk-3-dev \
            libxdo-dev \
            libfuse2 \
            xvfb \
            ffmpeg \
            pngquant

      - name: Install oxipng (GitHub release)
        run: |
          set -euo pipefail
          curl -sLO "https://github.com/oxipng/oxipng/releases/download/v${OXIPNG_VERSION}/oxipng_${OXIPNG_VERSION}-1_amd64.deb"
          sudo apt-get install -y "./oxipng_${OXIPNG_VERSION}-1_amd64.deb"

      # Exit 143 (SIGTERM) on Linux is often OOM during parallel rustc + linker.
      # Extra swap + fewer jobs keeps peak RSS below hosted-runner limits (release
      # builds are heavier than CI debug builds).
      - name: Linux — swap and compile job limit
        run: |
          SWAPFILE=/home/runner/cargo_extra.swap
          sudo fallocate -l 8G "$SWAPFILE" || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=8192 status=none
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"

      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          prefix-key: release-linux

      - name: Run tests (Linux)
        run: xvfb-run --auto-servernum cargo test --locked --target x86_64-unknown-linux-gnu

      - name: Bake asset packs
        run: python3 tools/bake_assets/bake_assets.py --out baked-packs

      - name: Build release
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Set artifact name
        id: artifact
        shell: bash
        run: |
          NAME="mahjuro-${RELEASE_TAG}-linux-x86_64"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "filename=${NAME}.AppImage" >> "$GITHUB_OUTPUT"

      # ──────────────────────────── Linux: AppImage ────────────────────────────
      - name: Build AppImage (Linux)
        run: |
          set -euo pipefail
          APPDIR="Mahjuro.AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"

          cp "target/x86_64-unknown-linux-gnu/release/mahjuro" "$APPDIR/usr/bin/mahjuro"
          chmod +x "$APPDIR/usr/bin/mahjuro"
          cp "target/x86_64-unknown-linux-gnu/release/libsteam_api.so" "$APPDIR/usr/bin/"
          cp baked-packs/pack_manifest.json "$APPDIR/usr/bin/"
          cp baked-packs/mahjuro-pack-shared.zip "$APPDIR/usr/bin/"
          cp baked-packs/mahjuro-pack-gameplay.zip "$APPDIR/usr/bin/"
          cp baked-packs/mahjuro-pack-music.zip "$APPDIR/usr/bin/"

          cp packaging/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          cp packaging/mahjuro.desktop "$APPDIR/mahjuro.desktop"
          cp icon.png "$APPDIR/mahjuro.png"

          # Fetch appimagetool.
          curl -L -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          ARCH=x86_64 ./appimagetool "$APPDIR" "${{ steps.artifact.outputs.filename }}"

      - name: Create update archive (Linux)
        id: update_archive
        run: |
          set -euo pipefail
          ROOT="$PWD"
          ARCHIVE="$ROOT/mahjuro-${RELEASE_TAG}-linux-x86_64.tar.gz"
          RELEASE_DIR="target/x86_64-unknown-linux-gnu/release"
          cp baked-packs/pack_manifest.json "$RELEASE_DIR/"
          cp baked-packs/mahjuro-pack-shared.zip "$RELEASE_DIR/"
          cp baked-packs/mahjuro-pack-gameplay.zip "$RELEASE_DIR/"
          cp baked-packs/mahjuro-pack-music.zip "$RELEASE_DIR/"
          (
            cd "$RELEASE_DIR"
            tar -czf "$ARCHIVE" mahjuro libsteam_api.so \
              pack_manifest.json \
              mahjuro-pack-shared.zip \
              mahjuro-pack-gameplay.zip \
              mahjuro-pack-music.zip
          )
          echo "filename=mahjuro-${RELEASE_TAG}-linux-x86_64.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.update_archive.outputs.filename }}
          path: ${{ steps.update_archive.outputs.filename }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: ${{ steps.artifact.outputs.filename }}
