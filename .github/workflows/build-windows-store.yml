name: Build Windows Store MSIX

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "4th version quad (must increase per Partner Center upload)"
        required: false
        default: "1"
      sign:
        description: "Sign with MSSTORE_SIGNING_* secrets"
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  MAHJURO_SKIP_ROOM_GI_BAKE: "1"
  MAHJURO_SKIP_ROOM_SHADOW_BAKE: "1"

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Package Microsoft Store MSIX
    runs-on: windows-2022

    env:
      MSSTORE_BUILD_NUMBER: ${{ inputs.build_number }}

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - uses: ./.github/actions/hydrate-lfs-bundle

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          prefix-key: build-windows-store
          cache-targets: false

      - name: Install asset bake tools
        shell: pwsh
        run: |
          choco install ffmpeg pngquant -y --no-progress
          $zip = "oxipng-10.1.1-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri "https://github.com/oxipng/oxipng/releases/download/v10.1.1/$zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath oxipng-unpack -Force
          $exe = Get-ChildItem oxipng-unpack -Recurse -Filter oxipng.exe | Select-Object -First 1
          Copy-Item $exe.FullName (Join-Path $env:RUNNER_TEMP "oxipng.exe")
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP)

      - name: Restore signing certificate
        if: inputs.sign && secrets.MSSTORE_SIGNING_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "msstore-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String("${{ secrets.MSSTORE_SIGNING_PFX_BASE64 }}"))
          echo "MSSTORE_SIGNING_PFX=$pfx" >> $env:GITHUB_ENV

      - name: Package MSIX
        shell: pwsh
        env:
          MSSTORE_PUBLISHER: ${{ secrets.MSSTORE_PUBLISHER }}
          MSSTORE_SIGNING_PASSWORD: ${{ secrets.MSSTORE_SIGNING_PASSWORD }}
        run: |
          $args = @("-Configuration", "Release")
          if ("${{ inputs.sign }}" -eq "true" -and $env:MSSTORE_SIGNING_PFX) {
            $args += "-Sign"
          }
          $args += "-Validate"
          .\scripts\package-windows-store.ps1 @args

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mahjuro-windows-store
          path: |
            mahjuro-store-v*-windows-x86_64.msix
            Mahjuro-Store.msix
