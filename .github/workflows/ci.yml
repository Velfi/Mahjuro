name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  actions: write # upload-artifact

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mahjuro.exe
            artifact_name: mahjuro-debug-windows-x86_64
          - name: Linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mahjuro
            artifact_name: mahjuro-debug-linux-x86_64
          - name: macOS
            runner: macos-latest
            target: aarch64-apple-darwin
            binary: mahjuro
            artifact_name: mahjuro-debug-macos-universal

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_AZURE_CREDS: ${{ secrets.AZURE_CLIENT_ID != '' }}

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add macOS x86_64 target
        if: matrix.name == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxcursor-dev \
            libvulkan-dev \
            libgtk-3-dev \
            libxdo-dev \
            xvfb

      # Exit 143 (SIGTERM) on Linux CI is often OOM during parallel rustc + linker.
      # Extra swap + fewer jobs keeps peak RSS below hosted-runner limits.
      - name: Linux — swap and compile job limit
        if: matrix.name == 'Linux'
        run: |
          SWAPFILE=/home/runner/cargo_extra.swap
          sudo fallocate -l 8G "$SWAPFILE" || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=8192 status=none
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"

      - name: Cache Cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Build (debug)
        if: matrix.name != 'macOS'
        run: cargo build --target ${{ matrix.target }}

      - name: Build macOS universal (debug)
        if: matrix.name == 'macOS'
        run: |
          cargo build --target aarch64-apple-darwin
          cargo build --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/debug/mahjuro \
            target/x86_64-apple-darwin/debug/mahjuro \
            -output target/debug-universal-mahjuro

      - name: Run tests
        if: matrix.name != 'Linux'
        run: cargo test

      - name: Run tests (Linux)
        if: matrix.name == 'Linux'
        run: xvfb-run --auto-servernum cargo test

      # Signing verification — skipped on fork PRs where secrets are unavailable.
      - name: Verify Apple codesign identity
        if: matrix.name == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm certificate.p12
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Found signing identity: $IDENTITY"
          codesign --sign "$IDENTITY" \
            --entitlements Entitlements.plist \
            --options runtime \
            --force \
            --timestamp \
            target/debug-universal-mahjuro
          echo "Codesign verification passed"

      - name: Verify AzureSignTool signing (Windows)
        if: matrix.name == 'Windows' && env.HAS_AZURE_CREDS == 'true'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          dotnet tool install --global AzureSignTool --version 7.0.1
          cp "target/${{ matrix.target }}/debug/${{ matrix.binary }}" test_sign.exe
          AzureSignTool sign \
            -kvu https://mahjuro.vault.azure.net \
            -kvc Mahjuro \
            -kvi "$AZURE_CLIENT_ID" \
            -kvt "$AZURE_TENANT_ID" \
            -kvs "$AZURE_CLIENT_SECRET" \
            -tr http://timestamp.digicert.com \
            -td sha256 \
            test_sign.exe
          rm test_sign.exe
          echo "AzureSignTool signing verification passed"

      - name: Prepare artifact (Unix)
        if: matrix.name != 'Windows'
        run: |
          mkdir -p staging
          if [ "${{ matrix.name }}" = "macOS" ]; then
            cp target/debug-universal-mahjuro staging/mahjuro
          else
            cp target/${{ matrix.target }}/debug/${{ matrix.binary }} staging/
          fi
          rsync -a --exclude='*.blend' --exclude='*.blend1' assets/ staging/assets/

      - name: Prepare artifact (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging
          Copy-Item "target\${{ matrix.target }}\debug\${{ matrix.binary }}" staging\
          Copy-Item -Recurse assets staging\assets
          Get-ChildItem staging\assets -Recurse -Include *.blend,*.blend1 | Remove-Item -Force

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: staging/