name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mahjuro.exe
            artifact_name: mahjuro-debug-windows-x86_64
          - name: Linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mahjuro
            artifact_name: mahjuro-debug-linux-x86_64
          - name: macOS
            runner: macos-latest
            target: aarch64-apple-darwin
            binary: mahjuro
            artifact_name: mahjuro-debug-macos-universal

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add macOS x86_64 target
        if: matrix.name == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libvulkan-dev

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Build (debug)
        if: matrix.name != 'macOS'
        run: cargo build --target ${{ matrix.target }}

      - name: Build macOS universal (debug)
        if: matrix.name == 'macOS'
        run: |
          cargo build --target aarch64-apple-darwin
          cargo build --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/debug/mahjuro \
            target/x86_64-apple-darwin/debug/mahjuro \
            -output target/debug-universal-mahjuro

      - name: Run tests
        run: cargo test

      - name: Prepare artifact (Unix)
        if: matrix.name != 'Windows'
        run: |
          mkdir -p staging
          if [ "${{ matrix.name }}" = "macOS" ]; then
            cp target/debug-universal-mahjuro staging/mahjuro
          else
            cp target/${{ matrix.target }}/debug/${{ matrix.binary }} staging/
          fi
          rsync -a --exclude='*.blend' --exclude='*.blend1' assets/ staging/assets/

      - name: Prepare artifact (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging
          Copy-Item "target\${{ matrix.target }}\debug\${{ matrix.binary }}" staging\
          Copy-Item -Recurse assets staging\assets
          Remove-Item staging\assets\*.blend, staging\assets\*.blend1 -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: staging/
