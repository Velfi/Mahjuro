name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mahjuro.exe
            artifact_name: mahjuro-debug-windows-x86_64
          - name: Linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mahjuro
            artifact_name: mahjuro-debug-linux-x86_64
          - name: macOS
            runner: macos-latest
            target: aarch64-apple-darwin
            binary: mahjuro
            artifact_name: mahjuro-debug-macos-universal

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_AZURE_CREDS: ${{ secrets.AZURE_CLIENT_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add macOS x86_64 target
        if: matrix.name == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libvulkan-dev

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Build (debug)
        if: matrix.name != 'macOS'
        run: cargo build --target ${{ matrix.target }}

      - name: Build macOS universal (debug)
        if: matrix.name == 'macOS'
        run: |
          cargo build --target aarch64-apple-darwin
          cargo build --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/debug/mahjuro \
            target/x86_64-apple-darwin/debug/mahjuro \
            -output target/debug-universal-mahjuro

      - name: Run tests
        run: cargo test

      # Signing verification — skipped on fork PRs where secrets are unavailable.
      - name: Verify Apple codesign identity
        if: matrix.name == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm certificate.p12
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Found signing identity: $IDENTITY"
          codesign --sign "$IDENTITY" \
            --entitlements Entitlements.plist \
            --options runtime \
            --force \
            --timestamp \
            target/debug-universal-mahjuro
          echo "Codesign verification passed"

      - name: Verify relic signing (Windows)
        if: matrix.name == 'Windows' && env.HAS_AZURE_CREDS == 'true'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          go install github.com/sassoftware/relic/v8@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID" \
            --output none
          RELIC_BIN="$(which relic)"
          cp "$RELIC_BIN" test_sign.exe
          relic sign --file test_sign.exe --key azure --config relic.conf 2>&1 || {
            echo "--- relic sign failed, dumping debug info ---"
            relic sign --file test_sign.exe --key azure --config relic.conf -d 9 2>&1 || true
            exit 1
          }
          rm test_sign.exe
          echo "Relic signing verification passed"

      - name: Prepare artifact (Unix)
        if: matrix.name != 'Windows'
        run: |
          mkdir -p staging
          if [ "${{ matrix.name }}" = "macOS" ]; then
            cp target/debug-universal-mahjuro staging/mahjuro
          else
            cp target/${{ matrix.target }}/debug/${{ matrix.binary }} staging/
          fi
          rsync -a --exclude='*.blend' --exclude='*.blend1' assets/ staging/assets/

      - name: Prepare artifact (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging
          Copy-Item "target\${{ matrix.target }}\debug\${{ matrix.binary }}" staging\
          Copy-Item -Recurse assets staging\assets
          Get-ChildItem staging\assets -Recurse -Include *.blend,*.blend1 | Remove-Item -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: staging/