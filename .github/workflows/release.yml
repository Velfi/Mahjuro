name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-release (e.g. v0.2.0 or v0.5.0-0)"
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  actions: write # upload/download artifacts within the workflow run

jobs:
  release-macos:
    uses: ./.github/workflows/release-macos.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    secrets: inherit

  release-linux:
    uses: ./.github/workflows/release-linux.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    secrets: inherit

  release-windows:
    uses: ./.github/workflows/release-windows.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    secrets: inherit

  create-release:
    needs: [release-macos, release-linux, release-windows]
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          if python3 scripts/aggregate_release_notes.py "$RELEASE_TAG" > release-notes.md; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "no CHANGELOG section for $RELEASE_TAG — falling back to auto-generated notes" >&2
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prerelease if tag has semver pre-release (e.g. v0.5.0-0)
        id: prerelease
        shell: bash
        run: |
          set -euo pipefail
          V="${RELEASE_TAG#v}"
          if [[ "$V" == *-* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (with CHANGELOG body)
        if: steps.notes.outputs.have_notes == 'true'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Mahjuro ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: ${{ steps.prerelease.outputs.value == 'true' }}
          body_path: release-notes.md
          files: artifacts/*

      - name: Create GitHub Release (auto-generated fallback)
        if: steps.notes.outputs.have_notes != 'true'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Mahjuro ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: ${{ steps.prerelease.outputs.value == 'true' }}
          generate_release_notes: true
          files: artifacts/*
