name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-release (e.g. v0.2.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mahjuro.exe
            artifact_suffix: windows-x86_64-setup
            artifact_ext: exe
          - name: Linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mahjuro
            artifact_suffix: linux-x86_64
            artifact_ext: AppImage
          - name: macOS
            runner: macos-latest
            target: aarch64-apple-darwin
            binary: mahjuro
            artifact_suffix: macos-universal
            artifact_ext: dmg

    name: Release ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Compute version (strip leading v)
        id: version
        shell: bash
        run: |
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add macOS x86_64 target
        if: matrix.name == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libvulkan-dev \
            libgtk-3-dev \
            libxdo-dev \
            libfuse2 \
            xvfb

      - name: Install AzureSignTool (Windows code signing)
        if: matrix.name == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global AzureSignTool --version 7.0.1

      - name: Install NSIS (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # Make sure makensis is on PATH for subsequent steps.
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Verify Azure Key Vault signing cert (Windows)
        if: matrix.name == 'Windows'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID" \
            --output none
          az keyvault certificate show \
            --vault-name mahjuro \
            --name Mahjuro \
            --query '{enabled:attributes.enabled,expires:attributes.expires}' \
            --output table

      - name: Import Apple signing certificate and notarization key
        if: matrix.name == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::error::APPLE_CERTIFICATE secret is empty"; exit 1
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          CERT_SIZE=$(wc -c < certificate.p12)
          if [ "$CERT_SIZE" -lt 100 ]; then
            echo "::error::Decoded certificate.p12 is only ${CERT_SIZE} bytes — APPLE_CERTIFICATE base64 is likely corrupt"; exit 1
          fi
          echo "Decoded certificate.p12: ${CERT_SIZE} bytes"
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm certificate.p12
          mkdir -p ~/.private_keys
          echo "$APPLE_API_KEY_CONTENT" > ~/.private_keys/AuthKey_${APPLE_API_KEY}.p8
          echo "APPLE_API_KEY_PATH=$HOME/.private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.target }}-cargo-

      - name: Run tests
        if: matrix.name != 'Linux'
        run: cargo test

      - name: Run tests (Linux)
        if: matrix.name == 'Linux'
        run: xvfb-run --auto-servernum cargo test

      - name: Build release (non-macOS)
        if: matrix.name != 'macOS'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build macOS universal release
        if: matrix.name == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/release-universal
          lipo -create \
            target/aarch64-apple-darwin/release/mahjuro \
            target/x86_64-apple-darwin/release/mahjuro \
            -output target/release-universal/mahjuro

      - name: Set artifact name
        id: artifact
        shell: bash
        run: |
          NAME="mahjuro-${RELEASE_TAG}-${{ matrix.artifact_suffix }}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "filename=${NAME}.${{ matrix.artifact_ext }}" >> "$GITHUB_OUTPUT"

      # ──────────────────────────── macOS: .app + .dmg ────────────────────────────
      - name: Build .app bundle (macOS)
        if: matrix.name == 'macOS'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APP="Mahjuro.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          # Binary
          cp target/release-universal/mahjuro "$APP/Contents/MacOS/mahjuro"
          chmod +x "$APP/Contents/MacOS/mahjuro"

          # Info.plist with version substituted in
          sed "s/__VERSION__/${VERSION}/g" packaging/Info.plist > "$APP/Contents/Info.plist"

          # Generate AppIcon.icns from icon.png. Source is small (120x120) so larger
          # sizes will be upscaled — replace icon.png with a higher-resolution
          # source to improve quality.
          ICONSET="AppIcon.iconset"
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          for spec in "16:icon_16x16.png" "32:icon_16x16@2x.png" \
                      "32:icon_32x32.png" "64:icon_32x32@2x.png" \
                      "128:icon_128x128.png" "256:icon_128x128@2x.png" \
                      "256:icon_256x256.png" "512:icon_256x256@2x.png" \
                      "512:icon_512x512.png" "1024:icon_512x512@2x.png"; do
            size="${spec%%:*}"
            name="${spec##*:}"
            sips -z "$size" "$size" icon.png --out "$ICONSET/$name" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          rm -rf "$ICONSET"

      - name: Embed Sparkle.framework (macOS)
        if: matrix.name == 'macOS'
        env:
          SPARKLE_VERSION: "2.9.1"
        run: |
          set -euo pipefail
          curl -fsSL -o "Sparkle-${SPARKLE_VERSION}.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir sparkle-dist
          tar -xf "Sparkle-${SPARKLE_VERSION}.tar.xz" -C sparkle-dist
          mkdir -p Mahjuro.app/Contents/Frameworks
          cp -R sparkle-dist/Sparkle.framework Mahjuro.app/Contents/Frameworks/
          # Stash the CLI tools where the appcast step below expects them.
          mkdir -p sparkle-bin
          cp sparkle-dist/bin/sign_update sparkle-bin/

      - name: Sign .app bundle (macOS)
        if: matrix.name == 'macOS'
        run: |
          codesign --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements Entitlements.plist \
            --options runtime \
            --force \
            --deep \
            --timestamp \
            Mahjuro.app
          codesign --verify --strict --verbose=2 Mahjuro.app

      - name: Notarize .app bundle (macOS)
        if: matrix.name == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ditto -c -k --keepParent Mahjuro.app Mahjuro-notarize.zip
          xcrun notarytool submit Mahjuro-notarize.zip \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          rm Mahjuro-notarize.zip
          xcrun stapler staple Mahjuro.app

      - name: Build DMG (macOS)
        if: matrix.name == 'macOS'
        run: |
          DMG="${{ steps.artifact.outputs.filename }}"
          STAGING="dmg-staging"
          rm -rf "$STAGING" "$DMG"
          mkdir "$STAGING"
          cp -R Mahjuro.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "Mahjuro" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG"
          rm -rf "$STAGING"

      - name: Sign and notarize DMG (macOS)
        if: matrix.name == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          DMG="${{ steps.artifact.outputs.filename }}"
          codesign --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG"
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Generate Sparkle appcast (macOS)
        if: matrix.name == 'macOS'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DMG="${{ steps.artifact.outputs.filename }}"
          # `sign_update` consumes the EdDSA private key on stdin (`--ed-key-file -`)
          # and prints `sparkle:edSignature="..." length="..."` to stdout.
          SIG_LINE=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            ./sparkle-bin/sign_update --ed-key-file - "$DMG")
          DMG_SIZE=$(stat -f%z "$DMG")
          PUB_DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          DMG_URL="https://github.com/Velfi/Mahjuro/releases/download/${RELEASE_TAG}/${DMG}"
          # Minimum macOS 10.13 mirrors LSMinimumSystemVersion in Info.plist.
          cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Mahjuro</title>
              <link>${DMG_URL}</link>
              <description>Mahjuro updates feed.</description>
              <language>en</language>
              <item>
                <title>Version ${VERSION}</title>
                <pubDate>${PUB_DATE}</pubDate>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>10.13</sparkle:minimumSystemVersion>
                <enclosure url="${DMG_URL}" type="application/octet-stream" length="${DMG_SIZE}" ${SIG_LINE} />
              </item>
            </channel>
          </rss>
          EOF
          # Strip the 10-space indent applied by the YAML run block.
          sed -i '' 's/^          //' appcast.xml
          echo "appcast.xml written:"
          cat appcast.xml

      - uses: actions/upload-artifact@v4
        if: matrix.name == 'macOS'
        with:
          name: appcast.xml
          path: appcast.xml

      # ──────────────────────────── Windows: NSIS .exe ────────────────────────────
      - name: Sign binary (Windows)
        if: matrix.name == 'Windows'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          AzureSignTool sign \
            -kvu https://mahjuro.vault.azure.net \
            -kvc Mahjuro \
            -kvi "$AZURE_CLIENT_ID" \
            -kvt "$AZURE_TENANT_ID" \
            -kvs "$AZURE_CLIENT_SECRET" \
            -tr http://timestamp.digicert.com \
            -td sha256 \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}"

      - name: Stage installer source (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $stage = "installer-src"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary }}" "$stage\"
          # Generate multi-resolution icon.ico from icon.png. ImageMagick is
          # preinstalled on windows-latest runners as `magick`.
          magick icon.png -define icon:auto-resize=256,128,64,48,32,16 "$stage\icon.ico"

      - name: Build NSIS installer (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $out = "${{ steps.artifact.outputs.filename }}"
          makensis `
            "/DVERSION=$env:VERSION" `
            "/DSOURCE_DIR=$PWD\installer-src" `
            "/DOUTFILE=$PWD\$out" `
            packaging\installer.nsi

      - name: Sign installer (Windows)
        if: matrix.name == 'Windows'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          AzureSignTool sign \
            -kvu https://mahjuro.vault.azure.net \
            -kvc Mahjuro \
            -kvi "$AZURE_CLIENT_ID" \
            -kvt "$AZURE_TENANT_ID" \
            -kvs "$AZURE_CLIENT_SECRET" \
            -tr http://timestamp.digicert.com \
            -td sha256 \
            "${{ steps.artifact.outputs.filename }}"

      # ──────────────────────────── Linux: AppImage ────────────────────────────
      - name: Build AppImage (Linux)
        if: matrix.name == 'Linux'
        run: |
          set -euo pipefail
          APPDIR="Mahjuro.AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"

          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$APPDIR/usr/bin/mahjuro"
          chmod +x "$APPDIR/usr/bin/mahjuro"

          cp packaging/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          cp packaging/mahjuro.desktop "$APPDIR/mahjuro.desktop"
          cp icon.png "$APPDIR/mahjuro.png"

          # Fetch appimagetool.
          curl -L -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          ARCH=x86_64 ./appimagetool "$APPDIR" "${{ steps.artifact.outputs.filename }}"

      # ──────────────── Update archive (for self_update crate) ────────────────
      - name: Create update archive (macOS)
        if: matrix.name == 'macOS'
        id: update_archive
        run: |
          codesign --sign "$APPLE_SIGNING_IDENTITY" \
            --options runtime \
            --timestamp \
            target/release-universal/mahjuro
          ARCHIVE="mahjuro-${RELEASE_TAG}-macos-universal.tar.gz"
          tar -czf "$ARCHIVE" -C target/release-universal mahjuro
          echo "filename=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Create update archive (Windows)
        if: matrix.name == 'Windows'
        id: update_archive_win
        shell: bash
        run: |
          ARCHIVE="mahjuro-${RELEASE_TAG}-windows-x86_64.zip"
          cd "target/${{ matrix.target }}/release"
          7z a "../../../${ARCHIVE}" "${{ matrix.binary }}"
          cd ../../..
          echo "filename=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Create update archive (Linux)
        if: matrix.name == 'Linux'
        id: update_archive_linux
        run: |
          ARCHIVE="mahjuro-${RELEASE_TAG}-linux-x86_64.tar.gz"
          tar -czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" mahjuro
          echo "filename=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Set update archive name
        id: update
        shell: bash
        run: |
          NAME="${{ steps.update_archive.outputs.filename }}${{ steps.update_archive_win.outputs.filename }}${{ steps.update_archive_linux.outputs.filename }}"
          echo "filename=${NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.update.outputs.filename }}
          path: ${{ steps.update.outputs.filename }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: ${{ steps.artifact.outputs.filename }}

  create-release:
    needs: build-release
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          if python3 scripts/extract_release_notes.py "$RELEASE_TAG" > release-notes.md; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "no CHANGELOG section for $RELEASE_TAG — falling back to auto-generated notes" >&2
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (with CHANGELOG body)
        if: steps.notes.outputs.have_notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Mahjuro ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          body_path: release-notes.md
          files: artifacts/*

      - name: Create GitHub Release (auto-generated fallback)
        if: steps.notes.outputs.have_notes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Mahjuro ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
