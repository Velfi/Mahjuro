name: Release build (Windows)

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # Pinned; Chocolatey oxipng can break when upstream moves (install from releases instead).
  OXIPNG_VERSION: "10.1.1"

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Release Windows
    # `windows-latest` can track Server 2025 + VS 2026 (e.g. MSVC 14.50). We hit
    # LNK4003 on libmahjuro-*.rlib there even with a cold target dir — linker
    # incompatibility with this crate's rlib/native mix, not GHA cache. Stay on
    # the mature image until upstream (rustc / image) sorts it out.
    runs-on: windows-2022

    env:
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          lfs: true

      - name: Compute version (strip leading v)
        id: version
        shell: bash
        run: |
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc

      # Cache crates.io sources only — not `target/`. (LNK4003 on `libmahjuro-*.rlib`
      # reproduced with *no* cache on VS2026 runners; see `runs-on` pin + release profile.)
      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          prefix-key: release-windows
          cache-targets: false

      - name: Install AzureSignTool (Windows code signing)
        shell: bash
        run: |
          dotnet tool install --global AzureSignTool --version 7.0.1

      - name: Install NSIS (Windows)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # Make sure makensis is on PATH for subsequent steps.
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Verify Azure Key Vault signing cert (Windows)
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID" \
            --output none
          az keyvault certificate show \
            --vault-name mahjuro \
            --name Mahjuro \
            --query '{enabled:attributes.enabled,expires:attributes.expires}' \
            --output table

      - name: Run tests
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Install asset bake tools (ffmpeg, pngquant)
        shell: pwsh
        run: |
          choco install ffmpeg pngquant -y --no-progress

      - name: Install oxipng (GitHub release)
        shell: pwsh
        run: |
          $zip = "oxipng-$env:OXIPNG_VERSION-x86_64-pc-windows-msvc.zip"
          $url = "https://github.com/oxipng/oxipng/releases/download/v$env:OXIPNG_VERSION/$zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath oxipng-unpack -Force
          $exe = Get-ChildItem oxipng-unpack -Recurse -Filter oxipng.exe | Select-Object -First 1
          if (-not $exe) { throw "oxipng.exe not found in release archive" }
          $dest = Join-Path $env:RUNNER_TEMP "oxipng"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item $exe.FullName (Join-Path $dest "oxipng.exe")
          Add-Content $env:GITHUB_PATH $dest

      - name: Bake asset packs
        shell: bash
        run: python3 tools/bake_assets/bake_assets.py --out baked-packs

      # Do not set RUSTFLAGS with /LINKREPRO (or /VERBOSE) for the whole workspace:
      # cargo runs many link.exe jobs in parallel; they share one output dir and clobber
      # each other, which can fail the `mahjuro` lib link with exit 101 before the bin.
      - name: Build release
        shell: bash
        run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc

      # Re-run with maximum rustc logging; single job avoids interleaved link.exe output.
      - name: Verbose rebuild for logs (on failure)
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          cargo build --release --locked -vv --target x86_64-pc-windows-msvc -j 1

      - name: Windows link diagnostics (on failure)
        if: failure()
        shell: bash
        run: |
          set -x
          LLVM_AR="$(rustc --print sysroot)/lib/rustlib/x86_64-pc-windows-msvc/bin/llvm-ar.exe"
          if [[ -x "$LLVM_AR" ]]; then
            shopt -s nullglob
            for f in target/x86_64-pc-windows-msvc/release/deps/libmahjuro-*.rlib; do
              echo "=== llvm-ar t $f ==="
              "$LLVM_AR" t "$f" 2>&1 | head -500
            done
          else
            echo "llvm-ar not found at $LLVM_AR"
          fi

      - name: Set artifact name
        id: artifact
        shell: bash
        run: |
          NAME="mahjuro-${RELEASE_TAG}-windows-x86_64-setup"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "filename=${NAME}.exe" >> "$GITHUB_OUTPUT"

      # ──────────────────────────── Windows: NSIS .exe ────────────────────────────
      - name: Sign binary (Windows)
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # Use a CLI-issued Key Vault token for AzureSignTool (-kva). The client-secret
          # credential path inside Azure.Identity sometimes hits AKV10046 against Key Vault;
          # az + get-access-token is a reliable alternative in CI.
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID" \
            --output none
          KV_TOKEN="$(az account get-access-token --resource https://vault.azure.net --query accessToken -o tsv)"
          AzureSignTool sign \
            -kvu https://mahjuro.vault.azure.net \
            -kvc Mahjuro \
            -kva "$KV_TOKEN" \
            -tr http://timestamp.digicert.com \
            -td sha256 \
            "target/x86_64-pc-windows-msvc/release/mahjuro.exe"

      - name: Stage installer source (Windows)
        shell: pwsh
        run: |
          $stage = "installer-src"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\mahjuro.exe" "$stage\"
          Copy-Item "packaging\steam_input\game_actions_4636490.vdf" "$stage\"
          Copy-Item "baked-packs\pack_manifest.json" "$stage\"
          Copy-Item "baked-packs\mahjuro-pack-essential.zip" "$stage\"
          Copy-Item "baked-packs\mahjuro-pack-gameplay.zip" "$stage\"
          Copy-Item "baked-packs\mahjuro-pack-audio.zip" "$stage\"
          # Generate multi-resolution icon.ico from icon.png. ImageMagick is
          # preinstalled on GitHub Windows runners as `magick`.
          magick icon.png -define icon:auto-resize=256,128,64,48,32,16 "$stage\icon.ico"

      - name: Build NSIS installer (Windows)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $out = "${{ steps.artifact.outputs.filename }}"
          # VIProductVersion must be four integers; strip semver pre-release (e.g. 0.5.0-0 → 0.5.0.0).
          $core = $env:VERSION -replace '-.*$', ''
          $viProduct = "${core}.0"
          makensis `
            "/DVERSION=$env:VERSION" `
            "/DVI_PRODUCT_VERSION=$viProduct" `
            "/DSOURCE_DIR=$PWD\installer-src" `
            "/DOUTFILE=$PWD\$out" `
            packaging\installer.nsi

      - name: Sign installer (Windows)
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID" \
            --output none
          KV_TOKEN="$(az account get-access-token --resource https://vault.azure.net --query accessToken -o tsv)"
          AzureSignTool sign \
            -kvu https://mahjuro.vault.azure.net \
            -kvc Mahjuro \
            -kva "$KV_TOKEN" \
            -tr http://timestamp.digicert.com \
            -td sha256 \
            "${{ steps.artifact.outputs.filename }}"

      - name: Create update archive (Windows)
        id: update_archive
        shell: bash
        run: |
          ARCHIVE="mahjuro-${RELEASE_TAG}-windows-x86_64.zip"
          ROOT="$PWD"
          cd "target/x86_64-pc-windows-msvc/release"
          7z a "$ROOT/${ARCHIVE}" mahjuro.exe game_actions_4636490.vdf \
            "$ROOT/baked-packs/pack_manifest.json" \
            "$ROOT/baked-packs/mahjuro-pack-essential.zip" \
            "$ROOT/baked-packs/mahjuro-pack-gameplay.zip" \
            "$ROOT/baked-packs/mahjuro-pack-audio.zip"
          cd ../../..
          echo "filename=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.update_archive.outputs.filename }}
          path: ${{ steps.update_archive.outputs.filename }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: ${{ steps.artifact.outputs.filename }}
