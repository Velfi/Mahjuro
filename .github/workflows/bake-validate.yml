name: Bake validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "assets/3d/**"
      - "assets/data/room_gi/**"
      - "assets/data/room_shadow/**"
      - "crates/mahjuro-render/src/room_gi_bake.rs"
      - "crates/mahjuro-render/src/room_shadow_bake.rs"
      - "crates/mahjuro-render/src/room_glb.rs"
      - "crates/mahjuro-render/src/archive_glb.rs"
      - "crates/mahjuro-render/src/gameplay_glb.rs"
      - "crates/mahjuro-render/src/wgpu_renderer/runtime/shop_environment.rs"
      - "crates/mahjuro-render/src/wgpu_renderer/runtime/shadow_setup.rs"
      - "shaders/**"
      - "build/offline_bake.rs"
      - ".github/workflows/bake-validate.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: bake-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lfs-assets:
    uses: ./.github/workflows/prepare-lfs-assets.yml
    with:
      git_ref: ${{ github.sha }}

  room-bake:
    name: Room bake drift check (Linux)
    needs: lfs-assets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      WGPU_BACKEND: vulkan
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          lfs: false

      - uses: ./.github/actions/hydrate-lfs-bundle

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxcursor-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            vulkan-tools \
            xvfb

      - name: Linux — swap and compile job limit
        run: |
          SWAPFILE=/home/runner/cargo_extra.swap
          sudo fallocate -l 8G "$SWAPFILE" || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=8192 status=none
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"

      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          prefix-key: bake-validate
          key: x86_64-unknown-linux-gnu

      - name: Vulkan adapter diagnostics
        shell: bash
        run: |
          set -euo pipefail
          vulkaninfo --summary || true

      - name: Build room bake tool
        run: MAHJURO_SKIP_COMMITTED_BAKE_CHECKS=1 cargo build --locked -p mahjuro-headless --bin mahjuro-bake --features bake --target x86_64-unknown-linux-gnu

      - name: Re-bake room GI + shadows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          MAHJURO_SKIP_COMMITTED_BAKE_CHECKS=1 \
          MAHJURO_LOG_FILE="$PWD/artifacts/mahjuro-bake.log" \
          xvfb-run --auto-servernum \
            cargo run --locked -p mahjuro-headless --bin mahjuro-bake --features bake --target x86_64-unknown-linux-gnu -- --kinds gi,shadow

      - name: Check for bake drift
        shell: bash
        run: |
          set -euo pipefail
          DIRS=(assets/data/room_gi assets/data/room_shadow)
          UNTRACKED="$(git ls-files -o --exclude-standard -- "${DIRS[@]}")"
          if [[ -n "$UNTRACKED" ]]; then
            echo "::error::Bake produced untracked files:"
            echo "$UNTRACKED"
            exit 1
          fi
          if ! git diff --quiet -- "${DIRS[@]}"; then
            echo "::error::Committed room bake outputs are stale. Re-run scripts/rebake-offline.sh room and commit updated .mgi/.msh + .inputs_stamp files."
            git status --short -- "${DIRS[@]}"
            git diff -- "${DIRS[@]}"
            exit 1
          fi

      - name: Upload bake logs and outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bake-validate-linux
          path: |
            artifacts/**
            assets/data/room_gi/**
            assets/data/room_shadow/**
