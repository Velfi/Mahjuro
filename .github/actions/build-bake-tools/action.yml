name: Build offline bake tools
description: >
  Build mahjuro-bake, mahjuro-bake-decal-atlases, and mahjuro-bake-relics into target/<triple>/<profile>/
  for local rebakes. Sets MAHJURO_SKIP_* so stale stamps do not block compiling the tools.

inputs:
  target:
    description: Rust triple (omit for host default target)
    required: false
    default: ""
  profile:
    description: Cargo profile (debug or release)
    required: false
    default: debug

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        bake=(cargo build --locked)
        if [[ -n "${{ inputs.target }}" ]]; then
          bake+=(--target "${{ inputs.target }}")
        fi
        if [[ "${{ inputs.profile }}" == release ]]; then
          bake+=(--release)
        fi
        export MAHJURO_SKIP_COMMITTED_BAKE_CHECKS=1
        export MAHJURO_SKIP_ROOM_GI_BAKE=1
        export MAHJURO_SKIP_ROOM_SHADOW_BAKE=1
        export MAHJURO_SKIP_SHOWCASE_DECAL_BAKE=1
        export MAHJURO_SKIP_RELIC_BAKE=1
        "${bake[@]}" -p mahjuro-headless --bin mahjuro-bake --features bake
        "${bake[@]}" -p mahjuro-render --bin mahjuro-bake-decal-atlases
        "${bake[@]}" -p mahjuro-render --bin mahjuro-bake-relics
