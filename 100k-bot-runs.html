<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahjuro bot report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --navy0: #0b1220;
    --navy1: #111b2e;
    --navy2: #1a2740;
    --navy3: #243652;
    --surface: #151f33;
    --surface-raised: #1c2840;
    --border: rgba(255, 255, 255, 0.12);
    --border-soft: rgba(255, 255, 255, 0.08);
    --text: #f2f5fa;
    --muted: #b6c5db;
    --faint: #8a9db5;
    --accent: #4db8e8;
    --accent-dim: rgba(77, 184, 232, 0.12);
    --accent2: #e8a06e;
    --accent2-dim: rgba(232, 160, 110, 0.12);
    --accent3: #e8c96e;
    --positive: #6fcf97;
    --danger: #f08090;
    --radius: 8px;
    --radius-sm: 6px;
    --font: "Atkinson Hyperlegible", ui-sans-serif, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }

  html {
    font-family: var(--font);
    line-height: 1.55;
    font-size: 15px;
    color: var(--text);
    background: var(--navy0);
    -webkit-font-smoothing: antialiased;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--navy0);
  }

  .dash-root {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1rem 1rem 2.5rem;
  }

  @media (min-width: 900px) {
    .dash-root { padding: 1.25rem 1.5rem 3rem; }
  }

  /* —— Header —— */
  .dash-header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem 1.5rem;
    margin-bottom: 1.25rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  .dash-header__brand {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .dash-header__title {
    font-size: clamp(1.35rem, 2.5vw, 1.65rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--text);
  }

  .dash-header__title em {
    font-style: normal;
    color: var(--accent);
  }

  .dash-header__tagline {
    margin: 0;
    font-size: 0.9rem;
    color: var(--muted);
    max-width: 40rem;
  }

  .dash-header__chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    justify-content: flex-end;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 700;
    border: 1px solid var(--border);
    background: var(--surface-raised);
    color: var(--text);
  }

  .chip--accent {
    border-color: rgba(77, 184, 232, 0.45);
    background: var(--accent-dim);
    color: var(--accent);
  }

  .chip--warm {
    border-color: rgba(232, 160, 110, 0.45);
    background: var(--accent2-dim);
    color: var(--accent2);
  }

  .chip--note {
    border-color: rgba(232, 201, 110, 0.4);
    background: rgba(232, 201, 110, 0.1);
    color: var(--accent3);
  }

  /* —— 2-column shell —— */
  .dash-cols {
    display: grid;
    gap: 1rem;
    align-items: start;
  }

  @media (min-width: 960px) {
    .dash-cols {
      grid-template-columns: minmax(0, 1fr) minmax(260px, 300px);
    }
  }

  .dash-col { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }

  .dash-full {
    margin-top: 1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  /* —— Widget cards —— */
  .widget {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .widget__head {
    padding: 0.65rem 0.85rem;
    border-bottom: 1px solid var(--border-soft);
    background: var(--surface-raised);
  }

  .widget__title {
    margin: 0;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
  }

  .widget__sub {
    margin: 0.35rem 0 0;
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.45;
  }

  .widget__body {
    padding: 0.75rem 0.85rem 0.85rem;
  }

  /* —— Hero metrics —— */
  .hero-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.65rem;
    margin-bottom: 0.25rem;
  }

  @media (max-width: 640px) {
    .hero-row { grid-template-columns: 1fr; }
  }

  .hero-metric {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.75rem 0.85rem;
  }

  .hero-metric__label {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
  }

  .hero-metric__value {
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
    margin: 0.25rem 0 0;
    color: var(--text);
  }

  .hero-metric__value--accent { color: var(--accent); }
  .hero-metric__value--warm { color: var(--accent2); }
  .hero-metric__value--note { color: var(--accent3); }

  .hero-metric__foot {
    margin-top: 0.45rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }

  .pill {
    font-size: 0.78rem;
    font-weight: 700;
    padding: 0.2rem 0.45rem;
    border-radius: 4px;
  }

  .pill--accent { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(77, 184, 232, 0.4); }
  .pill--warm { background: var(--accent2-dim); color: var(--accent2); border: 1px solid rgba(232, 160, 110, 0.4); }
  .pill--muted { background: var(--navy2); color: var(--muted); border: 1px solid var(--border); }

  /* —— KPI strip —— */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.55rem;
  }

  @media (min-width: 640px) {
    .kpi-grid { grid-template-columns: repeat(3, 1fr); }
  }

  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.55rem 0.65rem;
  }

  .kpi__label {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--faint);
    margin-bottom: 0.2rem;
  }

  .kpi__value {
    font-size: 1.05rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
    color: var(--text);
  }

  .kpi--highlight .kpi__value { color: var(--accent); }

  .mini-bars {
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
  }

  .mini-bar {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.35rem 0.5rem;
    align-items: center;
    font-size: 0.88rem;
  }

  .mini-bar__label {
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .mini-bar__track {
    grid-column: 1 / -1;
    height: 8px;
    border-radius: 4px;
    background: var(--navy1);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .mini-bar__fill {
    height: 100%;
    border-radius: 3px;
    background: var(--accent);
    min-width: 2px;
  }

  .mini-bar__fill--warm {
    background: var(--accent2);
  }

  .mini-bar__val {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-weight: 700;
    font-size: 0.85rem;
  }

  .loss-list {
    margin: 0;
    padding-left: 1.15rem;
    font-size: 0.9rem;
    color: var(--text);
    line-height: 1.55;
  }

  .loss-list li { margin-bottom: 0.35rem; }

  /* —— Stat grid —— */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
  }

  @media (min-width: 640px) {
    .stat-grid {
      grid-template-columns: minmax(9rem, 0.42fr) 1fr;
    }
  }

  .stat-grid dt {
    font-size: 0.88rem;
    color: var(--muted);
    padding: 0.45rem 0;
    border-bottom: 1px solid var(--border-soft);
    font-weight: 700;
  }

  .stat-grid dd {
    margin: 0;
    font-size: 0.88rem;
    padding: 0.45rem 0;
    border-bottom: 1px solid var(--border-soft);
    font-variant-numeric: tabular-nums;
    text-align: left;
    line-height: 1.45;
  }

  @media (min-width: 640px) {
    .stat-grid dd { text-align: right; }
  }

  .stat-grid dt:last-of-type,
  .stat-grid dd:last-of-type { border-bottom: none; }

  .stat-grid dt.dt-with-help {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.2rem;
  }

  /* —— Inline field help (?); empty button + ::after keeps TSV headers clean —— */
  .field-help {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 1.125rem;
    height: 1.125rem;
    margin: 0;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--navy2);
    color: var(--muted);
    font: inherit;
    line-height: 1;
    cursor: help;
    vertical-align: middle;
  }

  .field-help::after {
    content: '?';
    font-size: 0.62rem;
    font-weight: 800;
    line-height: 1;
  }

  .field-help:hover,
  .field-help:focus-visible {
    color: var(--accent);
    border-color: rgba(77, 184, 232, 0.45);
    background: var(--accent-dim);
  }

  .field-help:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .th-label-wrap,
  .data-table th.th-sort .th-sort__head {
    display: inline-flex;
    align-items: center;
    gap: 0.2rem;
    flex-wrap: wrap;
    max-width: 100%;
  }

  .data-table th.th-sort .th-sort__head {
    padding-right: 0.15rem;
  }

  .kpi__label-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.2rem;
    margin-bottom: 0.2rem;
  }

  .kpi__label-row .kpi__label {
    margin-bottom: 0;
  }

  /* —— Full-width cards —— */
  .dash-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .dash-card__head {
    padding: 0.65rem 0.85rem;
    border-bottom: 1px solid var(--border-soft);
    background: var(--surface-raised);
  }

  .dash-card__title {
    font-size: 1rem;
    font-weight: 700;
    margin: 0;
    color: var(--text);
  }

  .dash-card__subtitle {
    margin: 0.35rem 0 0;
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.45;
  }

  .dash-card__body { padding: 0.75rem 0.85rem 0.85rem; }

  .dash-card__subhead {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--muted);
    margin: 1rem 0 0.5rem;
    padding-top: 0.65rem;
    border-top: 1px solid var(--border-soft);
  }

  .dash-card__subhead:first-child {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }

  /* —— Tables —— */
  .table-scroll {
    overflow-x: auto;
    margin: 0;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft);
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }

  .data-table thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    text-align: left;
    padding: 0.5rem 0.6rem;
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--text);
    background: var(--navy3);
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
  }

  .data-table tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.03); }
  .data-table tbody tr:hover { background: rgba(77, 184, 232, 0.06); }

  .data-table td {
    padding: 0.45rem 0.6rem;
    border-bottom: 1px solid var(--border-soft);
    vertical-align: middle;
  }

  .data-table tbody tr:last-child td { border-bottom: none; }

  .data-table .num {
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-family: var(--mono);
    font-size: 0.85rem;
  }

  .data-table th.th-sort {
    cursor: pointer;
    user-select: none;
    padding-right: 1.35rem;
    position: relative;
  }

  .data-table th.th-sort:hover {
    color: var(--accent);
  }

  .data-table th.th-sort .th-sort__ind {
    position: absolute;
    right: 0.35rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.65rem;
    opacity: 0.85;
  }

  .data-table tr.data-table__group td {
    font-weight: 700;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    background: rgba(77, 184, 232, 0.08);
    border-bottom: 1px solid var(--border);
    padding-top: 0.55rem;
    padding-bottom: 0.5rem;
  }

  .table-with-copy {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .table-with-copy__bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    min-height: 1.5rem;
  }

  .table-copy-btn {
    font: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.28rem 0.65rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-raised);
    color: var(--muted);
    cursor: pointer;
  }

  .table-copy-btn:hover {
    color: var(--text);
    border-color: rgba(77, 184, 232, 0.45);
    background: var(--accent-dim);
  }

  .table-copy-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .table-copy-btn:disabled {
    opacity: 0.65;
    cursor: default;
  }

  .table-toolbar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.65rem;
    font-size: 0.86rem;
    color: var(--muted);
  }

  .table-toolbar input { accent-color: var(--accent); }

  .bar-track {
    height: 8px;
    border-radius: 4px;
    background: var(--navy1);
    border: 1px solid var(--border);
    overflow: hidden;
    width: 100%;
    min-width: 3rem;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--accent);
    transition: width 0.35s ease;
  }

  .bar-wrap {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    min-width: 5rem;
    width: 100%;
    max-width: 100%;
  }

  .delta-pos { color: var(--positive); }
  .delta-neg { color: var(--danger); }

  .prose {
    font-size: 0.9rem;
    color: var(--muted);
    line-height: 1.55;
    margin: 0;
  }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
  }

  .chip--tag {
    font-size: 0.82rem;
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
    background: var(--navy3);
    border: 1px solid var(--border);
    color: var(--text);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }

  .meta-block {
    font-size: 0.9rem;
    color: var(--muted);
    line-height: 1.6;
  }

  .meta-block strong { color: var(--text); font-weight: 650; }

  .error {
    color: var(--danger);
    padding: 1rem;
    background: rgba(255, 107, 122, 0.08);
    border: 1px solid rgba(255, 107, 122, 0.3);
    border-radius: var(--radius);
    margin: 1rem;
  }

  .foot-note {
    margin-top: 1rem;
    padding-top: 0.85rem;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.5;
  }

  .ci-help {
    margin: 0 0 1.1rem;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    background: var(--surface);
  }

  .ci-help > summary {
    cursor: pointer;
    padding: 0.55rem 0.75rem;
    font-size: 0.88rem;
    font-weight: 650;
    color: var(--accent);
  }

  .ci-help[open] > summary {
    border-bottom: 1px solid var(--border-soft);
  }

  .ci-help__body {
    padding: 0.65rem 0.85rem 0.8rem;
  }

  .ci-help__body p {
    margin: 0.45rem 0 0;
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.55;
  }

  .ci-help__body p:first-child {
    margin-top: 0;
  }

  .ci-help__body strong {
    color: var(--text);
    font-weight: 650;
  }

  .dash-header__tagline code {
    font-family: var(--mono);
    background: var(--navy2);
    padding: 0.1rem 0.35rem;
    border-radius: 4px;
    border: 1px solid var(--border-soft);
  }
</style>
</head>

<script>
(function () {
  const exportNode = document.getElementById('mahjuro-bot-export');
  const app = document.getElementById('app');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null && text !== '') e.textContent = text;
    return e;
  }

  /** Hover/focus tooltip; stops sort when placed inside a sortable header. */
  function fieldHelp(text) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'field-help';
    b.title = text;
    b.setAttribute('aria-label', text);
    const stop = (ev) => { ev.stopPropagation(); };
    b.addEventListener('click', (ev) => { ev.preventDefault(); stop(ev); });
    b.addEventListener('mousedown', stop);
    return b;
  }

  function thPlain(label, help) {
    const th = el('th', null);
    if (help) {
      const wrap = el('span', 'th-label-wrap');
      wrap.appendChild(document.createTextNode(label));
      wrap.appendChild(fieldHelp(help));
      th.appendChild(wrap);
    } else {
      th.textContent = label;
    }
    return th;
  }

  function fmtCompact(n) {
    if (typeof n !== 'number' || !Number.isFinite(n)) return String(n);
    return new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 2 }).format(n);
  }

  function loadPayload() {
    const text = exportNode.textContent.trim();
    const data = JSON.parse(text);
    globalThis.MAHJURO_BOT_EXPORT = data;
    return data;
  }

  function widget(title, subtitle, cls) {
    const section = el('section', 'widget' + (cls ? ' ' + cls : ''));
    const head = el('div', 'widget__head');
    head.appendChild(el('h2', 'widget__title', title));
    if (subtitle) head.appendChild(el('p', 'widget__sub', subtitle));
    section.appendChild(head);
    const body = el('div', 'widget__body');
    section.appendChild(body);
    return { section, body };
  }

  function card(title, subtitle) {
    const section = el('section', 'dash-card');
    const head = el('div', 'dash-card__head');
    head.appendChild(el('h2', 'dash-card__title', title));
    if (subtitle) head.appendChild(el('p', 'dash-card__subtitle', subtitle));
    section.appendChild(head);
    const body = el('div', 'dash-card__body');
    section.appendChild(body);
    return { section, body };
  }

  const RELIC_TIER_ORDER = ['legendary', 'rare', 'uncommon', 'common'];

  function rarityRank(slugOrLabel) {
    const s = String(slugOrLabel || '').toLowerCase();
    const i = RELIC_TIER_ORDER.indexOf(s);
    return i === -1 ? 99 : i;
  }

  function formatTier(raritySlug) {
    if (!raritySlug) return '—';
    const s = String(raritySlug).toLowerCase();
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function normalizeTableRow(r) {
    if (Array.isArray(r)) return { cells: r };
    return { cells: r.cells, keys: r.keys, raritySlug: r.raritySlug };
  }

  function cellSortValue(cell, sort) {
    if (!sort || sort === false) return null;
    const text = cell instanceof Node ? cell.textContent.trim() : String(cell);
    if (sort === 'num') {
      const n = parseFloat(text.replace(/,/g, ''));
      return Number.isFinite(n) ? n : 0;
    }
    if (sort === 'pct') {
      const n = parseFloat(text.replace(/%/g, ''));
      return Number.isFinite(n) ? n : 0;
    }
    if (sort === 'tier') return rarityRank(text === '—' ? '' : text.toLowerCase());
    return text.toLowerCase();
  }

  function rowSortValue(row, col, headers, cell) {
    const nr = normalizeTableRow(row);
    if (nr.keys && nr.keys[col] !== undefined && nr.keys[col] !== null) return nr.keys[col];
    return cellSortValue(cell, headers[col].sort);
  }

  function compareSortValues(a, b, dir) {
    const mul = dir === 'desc' ? -1 : 1;
    if (a == null && b == null) return 0;
    if (a == null) return 1 * mul;
    if (b == null) return -1 * mul;
    if (typeof a === 'number' && typeof b === 'number' && Number.isFinite(a) && Number.isFinite(b)) {
      if (a === b) return 0;
      return mul * (a < b ? -1 : 1);
    }
    return mul * String(a).localeCompare(String(b), undefined, { numeric: true });
  }

  function cellPlainText(cell) {
    return cell.textContent.replace(/\r?\n/g, ' ').replace(/\t/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function rowToTsvValues(tr) {
    const vals = [];
    for (const cell of tr.cells) {
      vals.push(cellPlainText(cell));
      const span = cell.colSpan || 1;
      for (let i = 1; i < span; i++) vals.push('');
    }
    return vals;
  }

  function tableToTsv(tableEl) {
    const lines = [];
    if (tableEl.tHead) {
      for (const tr of tableEl.tHead.rows) {
        lines.push(rowToTsvValues(tr).join('\t'));
      }
    }
    for (const tb of tableEl.tBodies) {
      for (const tr of tb.rows) {
        lines.push(rowToTsvValues(tr).join('\t'));
      }
    }
    return lines.join('\n');
  }

  function copyTextToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve, reject) => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        if (!document.execCommand('copy')) reject(new Error('copy failed'));
        else resolve();
      } catch (e) {
        reject(e);
      } finally {
        document.body.removeChild(ta);
      }
    });
  }

  /**
   * headers: { label, align?, help?, sort?: 'str'|'num'|'pct'|'tier'|false, sortDefault?: 'asc'|'desc' }
   * rows: cell arrays, or { cells, keys? } where keys[i] overrides sort value for column i
   */
  function addTable(parent, headers, rows, options) {
    const opts = options || {};
    const groupSpec = opts.group; // { enabled: () => bool, tierOf: (normRow) => string }

    const block = el('div', 'table-with-copy');
    const bar = el('div', 'table-with-copy__bar');
    const copyBtn = el('button', 'table-copy-btn', 'Copy');
    copyBtn.type = 'button';
    copyBtn.title = 'Copy table as TSV (spreadsheet paste)';
    bar.appendChild(copyBtn);
    block.appendChild(bar);

    const wrap = el('div', 'table-scroll');
    const table = el('table', 'data-table');
    const thead = el('thead');
    const trh = el('tr');
    const tbody = el('tbody');

    let normRows = rows.map(normalizeTableRow);
    const state = { col: null, dir: null };

    function sortDefaults(colIdx) {
      const h = headers[colIdx];
      if (h.sortDefault) return h.sortDefault;
      return h.sort === 'str' ? 'asc' : 'desc';
    }

    function sortedModels(models) {
      const col = state.col;
      const dir = state.dir;
      if (col == null || !headers[col] || !headers[col].sort) return models.slice();
      return models.slice().sort((ra, rb) => {
        const ca = ra.cells[col];
        const cb = rb.cells[col];
        const va = rowSortValue(ra, col, headers, ca);
        const vb = rowSortValue(rb, col, headers, cb);
        let cmp = compareSortValues(va, vb, dir);
        if (cmp === 0) {
          const na = String(ra.cells[0] instanceof Node ? ra.cells[0].textContent : ra.cells[0]);
          const nb = String(rb.cells[0] instanceof Node ? rb.cells[0].textContent : rb.cells[0]);
          cmp = na.localeCompare(nb);
        }
        return cmp;
      });
    }

    function tierKeyFromRow(nr) {
      if (!groupSpec || !groupSpec.tierOf) return '_other';
      return groupSpec.tierOf(nr);
    }

    function renderBody() {
      while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
      normRows = rows.map(normalizeTableRow);
      const useGroup = groupSpec && groupSpec.enabled && groupSpec.enabled();
      let list = sortedModels(normRows);
      if (useGroup) {
        const order = RELIC_TIER_ORDER.concat(['_other']);
        const byT = new Map();
        for (const t of order) byT.set(t, []);
        for (const nr of list) {
          const k = tierKeyFromRow(nr);
          const bucket = byT.has(k) ? k : '_other';
          byT.get(bucket).push(nr);
        }
        for (const t of order) {
          const chunk = byT.get(t);
          if (!chunk.length) continue;
          const trg = el('tr', 'data-table__group');
          const tdg = el('td', null);
          tdg.colSpan = headers.length;
          tdg.textContent = t === '_other' ? 'Unknown tier' : t.charAt(0).toUpperCase() + t.slice(1);
          trg.appendChild(tdg);
          tbody.appendChild(trg);
          for (const r of chunk) appendDataRow(r);
        }
      } else {
        for (const r of list) appendDataRow(r);
      }
    }

    function appendDataRow(r) {
      const tr = el('tr');
      for (let i = 0; i < r.cells.length; i++) {
        const cell = r.cells[i];
        const td = el('td', headers[i].align === 'right' ? 'num' : null);
        if (cell instanceof Node) td.appendChild(cell);
        else td.textContent = cell;
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }

    function updateIndicators() {
      const ths = trh.querySelectorAll('th');
      ths.forEach((th, i) => {
        th.removeAttribute('aria-sort');
        const ind = th.querySelector('.th-sort__ind');
        if (!ind) return;
        ind.textContent = '';
        if (state.col !== i) return;
        ind.textContent = state.dir === 'desc' ? '▼' : '▲';
        th.setAttribute('aria-sort', state.dir === 'desc' ? 'descending' : 'ascending');
      });
    }

    for (let i = 0; i < headers.length; i++) {
      const h = headers[i];
      const th = el('th', h.align === 'right' ? 'num' : null);
      if (h.sort) {
        th.classList.add('th-sort');
        th.setAttribute('role', 'button');
        th.setAttribute('tabindex', '0');
        th.title = 'Sort by ' + h.label;
        const head = el('span', 'th-sort__head');
        head.appendChild(el('span', 'th-sort__label', h.label));
        if (h.help) head.appendChild(fieldHelp(h.help));
        th.appendChild(head);
        th.appendChild(el('span', 'th-sort__ind', ''));
        const activate = (ev) => {
          ev.preventDefault();
          if (state.col === i) state.dir = state.dir === 'desc' ? 'asc' : 'desc';
          else {
            state.col = i;
            state.dir = sortDefaults(i);
          }
          updateIndicators();
          renderBody();
        };
        th.addEventListener('click', activate);
        th.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter' || ev.key === ' ') activate(ev);
        });
      } else if (h.help) {
        const wrap = el('span', 'th-label-wrap');
        wrap.appendChild(document.createTextNode(h.label));
        wrap.appendChild(fieldHelp(h.help));
        th.appendChild(wrap);
      } else {
        th.textContent = h.label;
      }
      trh.appendChild(th);
    }

    thead.appendChild(trh);
    table.appendChild(thead);
    table.appendChild(tbody);
    wrap.appendChild(table);
    block.appendChild(wrap);
    parent.appendChild(block);

    copyBtn.addEventListener('click', () => {
      const tsv = tableToTsv(table);
      const prev = copyBtn.textContent;
      copyBtn.disabled = true;
      copyTextToClipboard(tsv).then(() => {
        copyBtn.textContent = 'Copied';
        setTimeout(() => {
          copyBtn.textContent = prev;
          copyBtn.disabled = false;
        }, 1400);
      }).catch(() => {
        copyBtn.textContent = 'Failed';
        setTimeout(() => {
          copyBtn.textContent = prev;
          copyBtn.disabled = false;
        }, 2000);
      });
    });

    if (groupSpec && groupSpec.onRebuild) groupSpec.onRebuild(renderBody);
    renderBody();
    return block;
  }

  function kpiTile(k) {
    const k0 = el('div', 'kpi' + (k.highlight ? ' kpi--highlight' : ''));
    const lr = el('div', 'kpi__label-row');
    lr.appendChild(el('div', 'kpi__label', k.label));
    if (k.hint) lr.appendChild(fieldHelp(k.hint));
    k0.appendChild(lr);
    k0.appendChild(el('div', 'kpi__value', k.value));
    return k0;
  }

  function barCell(pct) {
    const track = el('div', 'bar-track');
    const fill = el('div', 'bar-fill');
    fill.style.width = Math.min(100, pct) + '%';
    track.appendChild(fill);
    const wrap = el('div', 'bar-wrap');
    wrap.appendChild(track);
    return wrap;
  }

  function miniBarList(parent, title, subtitle, items, warmFill) {
    const w = widget(title, subtitle);
    const box = el('div', 'mini-bars');
    const maxV = Math.max(1e-9, ...items.map((x) => x.v));
    for (const it of items) {
      const row = el('div', 'mini-bar');
      row.appendChild(el('span', 'mini-bar__label', it.name));
      row.appendChild(el('span', 'mini-bar__val', it.display));
      const track = el('div', 'mini-bar__track');
      track.setAttribute('aria-hidden', 'true');
      const fill = el('div', 'mini-bar__fill' + (warmFill ? ' mini-bar__fill--warm' : ''));
      fill.style.width = (100 * it.v / maxV).toFixed(1) + '%';
      track.appendChild(fill);
      row.appendChild(track);
      box.appendChild(row);
    }
    w.body.appendChild(box);
    parent.appendChild(w.section);
  }

  function lossSidebar(parent, lb) {
    if (!lb || !lb.losses) return;
    const w = widget('When runs are lost', 'Engine stop reasons (losses only, counts and share of losses)');
    const ul = el('ul', 'loss-list');
    const oop = lb.out_of_plays || 0;
    const na = lb.no_actions_remaining || 0;
    const other = Math.max(0, lb.losses - oop - na);
    function item(label, count, pctOfLosses) {
      const li = el('li');
      li.textContent = label + ': ' + count + ' run' + (count === 1 ? '' : 's') + ' (' + pctOfLosses.toFixed(1) + '% of losses)';
      ul.appendChild(li);
    }
    item('Out of plays', oop, lb.out_of_plays_pct_of_losses ?? (100 * oop / lb.losses));
    item('No actions remaining', na, lb.no_actions_pct_of_losses ?? (100 * na / lb.losses));
    if (other > 0) item('Other or mixed', other, (100 * other) / lb.losses);
    w.body.appendChild(ul);
    parent.appendChild(w.section);
  }

  function renderV2(data) {
    const runs = data.runs;
    const mode = data.mode || {};
    const sums = (data.aggregate && data.aggregate.sums) || {};
    const d = data.derived || {};
    const pr = d.per_run || {};
    const meta = data.meta || {};

    const HELP_WILSON_CI = 'Wilson 95% interval for a binomial proportion (the rate implied by this row’s counts). Wide bands mean few trials; standard frequentist CI, not a Bayesian credible interval.';
    const HELP_WILSON_WIN_RATE = 'Wilson 95% interval for wins ÷ buys on this row (only defined when bought ≥ 1).';

    document.title = 'Mahjuro bot — ' + runs + ' runs';

    const stake = mode.stake != null ? String(mode.stake) : '—';
    const wins = sums.victories ?? 0;
    const losses = Math.max(0, runs - wins);

    const header = el('header', 'dash-header');
    const brand = el('div', 'dash-header__brand');
    const h1 = el('h1', 'dash-header__title');

    const em = el('em');
    em.textContent = 'bot';
    h1.appendChild(em);
    h1.appendChild(document.createTextNode(' report'));
    brand.appendChild(h1);
    const tag = el('p', 'dash-header__tagline');
    tag.appendChild(document.createTextNode('Same numbers as the CLI summary. Schema v3 adds Wilson 95% CIs and per-ante hazard. Per-run lines: '));
    const code = el('code');
    code.textContent = 'mahjuro bot --output-runs';
    code.style.fontSize = '0.92em';
    code.style.color = 'var(--accent)';
    tag.appendChild(code);
    tag.appendChild(document.createTextNode('.'));
    brand.appendChild(tag);
    header.appendChild(brand);
    const chips = el('div', 'dash-header__chips');
    chips.appendChild(el('span', 'chip chip--accent', 'schema v' + (data.schema_version ?? '?')));
    if (meta.crate_version) chips.appendChild(el('span', 'chip', meta.crate_version));
    chips.appendChild(el('span', 'chip chip--note', runs + ' runs'));
    chips.appendChild(el('span', 'chip chip--warm', stake));
    chips.appendChild(el('span', 'chip', 'target ' + (mode.base_target ?? '—')));
    header.appendChild(chips);
    app.appendChild(header);

    const ciHelp = el('details', 'ci-help');
    ciHelp.appendChild(el('summary', null, 'What does "95% CI" mean?'));
    const ciBody = el('div', 'ci-help__body');
    function ciP(text) {
      const p = el('p');
      p.textContent = text;
      ciBody.appendChild(p);
    }
    function ciEx(lead, rest) {
      const p = el('p');
      const s = el('strong');
      s.textContent = lead;
      p.appendChild(s);
      p.appendChild(document.createTextNode(' ' + rest));
      ciBody.appendChild(p);
    }
    ciP('The tables show a percentage from your bot batch (for example, how often it wins). The 95% CI is a "could easily be this low or this high" band around that number, based only on how many runs went into the count. More runs usually make the band narrower, like a poll\'s margin of error. It does not mean the true long-run rate has a 95% chance of sitting inside this one interval on this one report.');
    ciEx('Example 1:', '400 runs and 100 wins give a 25.0% win rate. The 95% band this report uses for that situation runs about 21.0% through 29.5%. Treating 25% as exact would be misleading — anything in that band is still plausible for the same batch.');
    ciEx('Example 2:', 'Suppose only 50 runs reached a certain ante and 10 died there: that is a 20% hazard, but the same kind of interval is about 11.2% through 33.0%. A handful of different deaths would swing the headline, so tiny gaps between rows are often just noise.');
    ciP('Different tables count different things. Win rate divides by every run. "Death hazard" divides only by runs that actually reached that ante. Relic win% divides by runs where the bot bought that relic — it describes that subset of games, not proof the relic caused wins.');
    ciP('If two intervals overlap, that does not automatically mean the two rates are the same; if they do not overlap, it is a hint worth a closer look, not a courtroom verdict. Relic deltas and early/late splits still mix shop luck with skill — see the short note at the bottom of the page.');
    ciHelp.appendChild(ciBody);
    app.appendChild(ciHelp);

    const grid = el('div', 'dash-cols');
    const colM = el('div', 'dash-col dash-col--main');
    const colR = el('aside', 'dash-col dash-col--side');
    colR.setAttribute('aria-label', 'Summary panels');
    grid.appendChild(colM);
    grid.appendChild(colR);
    app.appendChild(grid);

    const hero = el('div', 'hero-row');
    function heroCell(label, value, cls, pills) {
      const h = el('div', 'hero-metric');
      h.appendChild(el('div', 'hero-metric__label', label));
      const v = el('div', 'hero-metric__value ' + (cls || ''), value);
      h.appendChild(v);
      if (pills && pills.length) {
        const foot = el('div', 'hero-metric__foot');
        for (const p of pills) foot.appendChild(el('span', 'pill ' + p.cls, p.text));
        h.appendChild(foot);
      }
      return h;
    }
    const wci = d.overall_win_rate_wilson_95;
    const winPills = [{ cls: 'pill--accent', text: wins + ' wins' }, { cls: 'pill--warm', text: losses + ' losses' }];
    if (wci && wci.lo != null && wci.hi != null) {
      winPills.push({ cls: 'pill--muted', text: '95% ' + wci.lo.toFixed(1) + '–' + wci.hi.toFixed(1) + '%' });
    }
    hero.appendChild(heroCell('Win rate', (pr.win_rate_pct ?? 0).toFixed(1) + '%', 'hero-metric__value--accent', winPills));
    hero.appendChild(heroCell('Runs in sample', String(runs), 'hero-metric__value--note',
      [{ cls: 'pill--muted', text: 'Monte Carlo batch' }]));
    hero.appendChild(heroCell('Avg blinds cleared', (pr.blinds_cleared ?? 0).toFixed(2), 'hero-metric__value--warm',
      [{ cls: 'pill--muted', text: 'per run' }]));
    colM.appendChild(hero);

    function fmtWilson(lo, hi) {
      if (lo == null || hi == null) return '—';
      return lo.toFixed(1) + '–' + hi.toFixed(1) + '%';
    }

    /** Two decimals; leading ~ when the value is positive but still rounds to 0.00. */
    function fmtAvg2(n) {
      const v = Number(n ?? 0);
      const s = v.toFixed(2);
      if (v > 0 && s === '0.00') return '~' + s;
      return s;
    }

    /** Readable full average for tooltips (avoids long float tails from JSON). */
    function fmtExactAvg(n) {
      const v = Number(n ?? 0);
      if (v === 0) return '0';
      return String(Number(v.toPrecision(12)));
    }

    if ((d.deaths_by_ante || []).length) {
      const anteC = card('Deaths by ante', 'Share of all runs; Wilson 95% CI on the binomial proportion. Bar = relative to busiest ante. Click column headers to sort.');
      const rows = d.deaths_by_ante.map((row) => ({
        cells: [
          String(row.ante),
          String(row.count),
          row.pct_of_runs.toFixed(1) + '%',
          fmtWilson(row.pct_ci_lo, row.pct_ci_hi),
          barCell(row.dashboard_bar_pct || 0)
        ],
        keys: [Number(row.ante), row.count, row.pct_of_runs, null, row.dashboard_bar_pct || 0]
      }));
      addTable(anteC.body,
        [
          { label: 'Ante', sort: 'num' },
          { label: 'Deaths', sort: 'num', align: 'right' },
          { label: '% runs', sort: 'pct', align: 'right',
            help: 'Deaths on this ante ÷ all runs in the batch (not conditioned on reaching the ante).' },
          { label: '95% CI', sort: 'str', sortDefault: 'asc', align: 'right', help: HELP_WILSON_CI },
          { label: 'Relative share', sort: 'pct', align: 'right',
            help: 'Bar width vs the ante with the most deaths (visual only; shares need not sum to 100%).' }
        ],
        rows);
      colM.appendChild(anteC.section);
    }

    if ((d.deaths_by_ante_hazard || []).length) {
      const hazC = card('Death hazard by ante', 'P(die on this ante | reached it): denominator is runs that started the ante. Wilson 95% CI.');
      addTable(hazC.body,
        [
          { label: 'Ante', sort: 'num' },
          { label: 'Reached', sort: 'num', align: 'right',
            help: 'Runs that started this ante before winning or dying earlier.' },
          { label: 'Deaths', sort: 'num', align: 'right',
            help: 'Runs that died while playing this ante (numerator for hazard).' },
          { label: 'Hazard', sort: 'pct', align: 'right',
            help: 'Deaths ÷ reached: chance of dying on this ante given you got that far.' },
          { label: '95% CI', sort: 'str', sortDefault: 'asc', align: 'right', help: HELP_WILSON_CI }
        ],
        d.deaths_by_ante_hazard.map((row) => ({
          cells: [
            String(row.ante),
            String(row.reached),
            String(row.deaths),
            row.hazard_pct.toFixed(1) + '%',
            fmtWilson(row.hazard_ci_lo, row.hazard_ci_hi)
          ],
          keys: [Number(row.ante), row.reached, row.deaths, row.hazard_pct, null]
        })));
      colM.appendChild(hazC.section);
    }

    const kpiRow = el('div', 'kpi-grid');
    for (const k of d.kpis || []) kpiRow.appendChild(kpiTile(k));
    colM.appendChild(kpiRow);

    const pbd = sums.peak_blind_detail;
    if (pbd && pbd.total_score != null) {
      const peakC = card(
        'Peak blind (batch max)',
        'Single blind with the highest round score in this batch: active relics after that blind and each scoring step (plays show compact tile labels; structure = bank cash-in). Points are round-score deltas after each action.');
      const sub = el('div', 'peak-blind-detail');
      const head = el('p', 'peak-blind-detail__head');
      head.appendChild(document.createTextNode(
        (pbd.blind_label || pbd.blind_slot || '—') +
        ' · target ' + String(pbd.target_score ?? '—') +
        ' · scored ' + fmtCompact(pbd.total_score ?? 0)));
      sub.appendChild(head);
      if ((pbd.relics || []).length) {
        const relP = el('p', 'peak-blind-detail__relics');
        const rs = el('strong');
        rs.textContent = 'Relics: ';
        relP.appendChild(rs);
        relP.appendChild(document.createTextNode(pbd.relics.join(', ')));
        sub.appendChild(relP);
      }
      const actions = pbd.scoring_actions || [];
      if (actions.length) {
        const tbl = el('table', 'data-table peak-blind-detail__table');
        const thead = el('thead');
        const hr = el('tr');
        const peakCols = [
          ['#', null],
          ['Kind', 'Scoring step type (yaku, hook, structure cash-in, etc.).'],
          ['Points', 'Round-score delta from this step.'],
          ['Tiles', 'Tiles involved (compact notation; empty if none).']
        ];
        for (const [lab, h] of peakCols) {
          hr.appendChild(h ? thPlain(lab, h) : el('th', null, lab));
        }
        thead.appendChild(hr);
        tbl.appendChild(thead);
        const tb = el('tbody');

        for (const a of actions) {

          tr.appendChild(el('td', 'num', fmtCompact(a.points ?? 0)));
          tr.appendChild(el('td', 'peak-blind-detail__tiles', a.tiles != null ? String(a.tiles) : '—'));
          tb.appendChild(tr);
        }
        tbl.appendChild(tb);
        sub.appendChild(tbl);
      }
      peakC.body.appendChild(sub);
      colM.appendChild(peakC.section);
    }

    const sumW = widget('Economics and pacing', 'Per-run averages from derived.per_run');
    const dl = el('dl', 'stat-grid');
    function row(label, value, hint, valueTitle) {
      const dt = el('dt', hint ? 'dt-with-help' : null);
      dt.appendChild(document.createTextNode(label));
      if (hint) dt.appendChild(fieldHelp(hint));
      dl.appendChild(dt);
      const dd = el('dd', null, value);
      if (valueTitle) dd.title = valueTitle;
      dl.appendChild(dd);
    }
    row('Victories', wins + ' / ' + runs + ' (' + (pr.win_rate_pct ?? 0).toFixed(1) + '%' +
      (wci && wci.lo != null && wci.hi != null ? '; 95% Wilson ' + wci.lo.toFixed(1) + '–' + wci.hi.toFixed(1) + '%' : '') + ')',
      'Overall wins ÷ runs. When shown, the Wilson range is a 95% CI for that overall win rate (same method as relic Win% CIs).');
    row('Avg blinds cleared', (pr.blinds_cleared ?? 0).toFixed(2),
      'Mean blinds cleared per run (small, big, and boss each count as one).');
    row('Avg antes cleared', (pr.antes_cleared ?? 0).toFixed(2),
      'Mean boss blinds cleared per run (finishing a boss advances the ante).');
    row('Max ante reached', String(sums.max_ante_reached ?? 0));
    row('Avg total score', fmtCompact(pr.total_score ?? 0),
      'Per-run mean of cumulative score earned over the whole run.');
    row('Avg plays used', (pr.plays ?? 0).toFixed(2),
      'Mean plays consumed per run (each blind gives a fresh play budget).');
    row('Avg discards used',

            help: 'Sum of this counter across all runs in the batch (see table title).' }
        ],
        tbl.rows.map((row) => ({
          cells: [row.name, String(row.count)],
          keys: [row.name.toLowerCase(), row.count]
        })));
      full.appendChild(sec.section);
    }

    app.appendChild(full);

    const foot = el('p', 'foot-note',
      'Wilson intervals are for binomial proportions. Relic Δ and timing splits still reflect shop selection and run state — not causal power. For bootstraps / FDR on JSONL, see tools/bot_jsonl_stats.py.');
    app.appendChild(foot);
  }

  try {
    const data = loadPayload();
    const sv = data.schema_version;
    if (sv !== 2 && sv !== 3 && sv !== 4) {
      app.appendChild(el('div', 'error', 'Expected export schema_version 2–4; got ' + sv + '. Re-run: mahjuro bot -o report.html'));
    } else {
      renderV2(data);
    }
  } catch (e) {
    app.appendChild(el('div', 'error', 'Failed to load embedded bot JSON: ' + e));
  }
})();
</script>
</body>
</html>
