[workspace]
members = [
    ".",
    "crates/mahjuro-assets",
    "crates/mahjuro-bake-stamp",
    "crates/mahjuro-distribution",
    "crates/mahjuro-gfx-types",
    "crates/mahjuro-types",
    "crates/mahjuro-core",
    "crates/mahjuro-render",
    "crates/mahjuro-headless",
]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "0.6.1-4"
edition = "2024"
publish = false

[workspace.dependencies]
mahjuro = { path = ".", default-features = false }
mahjuro-assets = { path = "crates/mahjuro-assets" }
mahjuro-distribution = { path = "crates/mahjuro-distribution", default-features = false }
mahjuro-bake-stamp = { path = "crates/mahjuro-bake-stamp" }
mahjuro-core = { path = "crates/mahjuro-core" }
mahjuro-gfx-types = { path = "crates/mahjuro-gfx-types" }
mahjuro-render = { path = "crates/mahjuro-render", default-features = false }
mahjuro-types = { path = "crates/mahjuro-types" }
anyhow = "1.0.102"
arboard = "3.6.1"
bytemuck = { version = "1.23", features = ["derive"] }
chrono = "0.4.44"
clap = { version = "4.5", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
dirs = "6.0.0"
enum_dispatch = "0.3"
env_logger = "0.11.8"
fontdue = "0.9.3"
glam = { version = "0.30.9", features = ["bytemuck"] }
gltf = { version = "1.4.1", features = [
    "KHR_texture_transform",
    "KHR_lights_punctual",
    "KHR_materials_emissive_strength",
] }
human_format = "1.2.1"
ignore = "0.4.25"
image = { version = "0.25", default-features = false }
indicatif = { version = "0.17", features = ["rayon"] }
log = "0.4.28"
lyon_path = "1.0"
lyon_tessellation = "1.0"
muda = "0.17.2"
parking_lot = "0.12"
pollster = "0.4.0"
proptest = "1.6"
rand = "0.10.0"
raw-window-handle = "0.6"
rayon = "1.11.0"
rodio = { version = "0.19", features = ["vorbis", "mp3"] }
rustc-hash = "2.1"
sdl3 = { version = "0.17", features = ["raw-window-handle"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
steamworks = { version = "0.13", features = ["raw-bindings"] }
thiserror = "2.0.18"
ttf-parser = "0.25"
wgpu = { version = "29.0.1" }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
lru = "0.12"
memmap2 = "0.9"
bumpalo = "3"
crossbeam-channel = "0.5"
zstd = "0.13"

[package]
name = "mahjuro"
version.workspace = true
edition.workspace = true
default-run = "mahjuro"

[features]
default = ["game", "dist-steam"]
game = [
    "dep:rodio",
    "dep:muda",
    "dep:arboard",
    "mahjuro-render/clipboard",
    "mahjuro-render/windowed",
]
dist-steam = ["mahjuro-distribution/steam"]
dist-mas = [
    "mahjuro-distribution/macos-store",
    "mahjuro-assets/store-bundle-only",
]
dist-msstore = [
    "mahjuro-distribution/windows-store",
    "mahjuro-assets/store-bundle-only",
]
headless-screenshot = [
    "dep:rodio",
    "dep:arboard",
    "mahjuro-distribution/steam",
    "mahjuro-render/clipboard",
]
# Skips committed offline bake freshness in `build.rs` while compiling `mahjuro` as a
# dependency of `mahjuro-headless` (room bakes). Without this, stale stamps block the
# bake binary itself — chicken and egg.
offline-bake-support = []

[[bin]]
name = "mahjuro"
path = "src/bin/mahjuro.rs"
required-features = ["game"]

[profile.release-with-debug]
inherits = "release"
debug = true

# Enable a moderate amount of optimization in the dev profile. bumped from 1
# → 2 so the per-frame render path (cmd-walk, instance allocation, decomp
# recursion) stays usable in editor playtesting without paying full release
# build times.
[profile.dev]
opt-level = 2

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[dependencies]
mahjuro-assets.workspace = true
mahjuro-gfx-types.workspace = true
mahjuro-types.workspace = true
mahjuro-core.workspace = true
mahjuro-render.workspace = true
anyhow.workspace = true
clap.workspace = true
env_logger.workspace = true
fontdue.workspace = true
glam.workspace = true
sdl3 = { workspace = true, features = ["build-from-source-static"] }
log.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
raw-window-handle.workspace = true
thiserror.workspace = true
muda = { workspace = true, optional = true }
chrono.workspace = true
dirs.workspace = true
arboard = { workspace = true, optional = true }
enum_dispatch.workspace = true
rodio = { workspace = true, optional = true }
rayon.workspace = true
indicatif.workspace = true
rustc-hash.workspace = true
human_format.workspace = true
mahjuro-distribution.workspace = true

# Patched wgpu-hal:
#   - Clear stale Metal vertex buffer slots when switching pipelines (fixes
#     Metal validation "unused binding at Buffer index …").
#   - Skip the `vkAcquireNextImage` fence wait on non-Windows targets, mirroring
#     https://github.com/gfx-rs/wgpu/pull/9486 — the wait serialized acquire
#     to the gamescope nested compositor on Steam Deck game mode and dropped
#     the game to ~10 FPS.
# See vendor/wgpu-hal.
[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSEvent"] }

[build-dependencies]
ignore.workspace = true
mahjuro-bake-stamp.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "bot"
harness = false
