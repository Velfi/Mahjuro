[package]
name = "mahjuro"
version = "0.5.0-18"
edition = "2024"

[profile.release-with-debug]
inherits = "release"
debug = true

# Enable a moderate amount of optimization in the dev profile. bumped from 1
# → 2 so the per-frame render path (cmd-walk, instance allocation, decomp
# recursion) stays usable in editor playtesting without paying full release
# build times.
[profile.dev]
opt-level = 2

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[dependencies]
anyhow = "1.0.102"
bytemuck = { version = "1.23", features = ["derive"] }
cassowary = "0.3.0"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11.8"
lyon_path = "1.0"
lyon_tessellation = "1.0"
fontdue = "0.9.3"
glam = { version = "0.30.9", features = ["bytemuck"] }
gltf = { version = "1.4.1", features = [
    "KHR_texture_transform",
    "KHR_lights_punctual",
    "KHR_materials_emissive_strength",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
sdl3 = { version = "0.17", features = ["build-from-source-static", "raw-window-handle"] }
log = "0.4.28"
pollster = "0.4.0"
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
raw-window-handle = "0.6"
thiserror = "2.0.18"
ttf-parser = "0.25"
wgpu = "29.0.1"
muda = "0.17.2"
chrono = "0.4.44"
dirs = "6.0.0"
arboard = "3.6.1"
enum_dispatch = "0.3"
rodio = { version = "0.19", features = ["vorbis", "mp3"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rayon = "1.11.0"
indicatif = { version = "0.17", features = ["rayon"] }
rustc-hash = "2.1"
human_format = "1.2.1"
steamworks = { version = "0.13", features = ["raw-bindings"] }
resvg = "0.44"

# Patched wgpu-hal:
#   - Clear stale Metal vertex buffer slots when switching pipelines (fixes
#     Metal validation "unused binding at Buffer index …").
#   - Skip the `vkAcquireNextImage` fence wait on non-Windows targets, mirroring
#     https://github.com/gfx-rs/wgpu/pull/9486 — the wait serialized acquire
#     to the gamescope nested compositor on Steam Deck game mode and dropped
#     the game to ~10 FPS.
# See vendor/wgpu-hal.
[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSEvent"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.6"

[[bench]]
name = "bot"
harness = false
